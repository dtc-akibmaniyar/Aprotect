<template>
    <div class="unified-markup-container">
        <!-- Header Section -->
        <div class="page-header">
            <div class="header-content">
                <h1 class="page-title">
                    <lightning-icon icon-name="utility:settings" size="medium" class="title-icon"></lightning-icon>
                    Set Dealer Markups
                </h1>
                <p class="page-subtitle">Configure pricing and markup for warranty packages and additional options</p>
            </div>
        </div>

        <!-- Bulk Update Section -->
        <div class="bulk-update-section">
            <div class="section-card">
                <div class="card-header">
                    <h3 class="card-title">Bulk Update</h3>
                    <p class="card-description">Apply the same markup to all terms or additional options</p>
                </div>
                <div class="card-content">
                    <div class="bulk-form">
                        <div class="form-group">
                            <label class="form-label">Default Term Markup</label>
                            <div class="markup-input-row">
                                <select 
                                    name="default-term-markup-type"
                                    onchange={handleDefaultTermMarkupTypeChange}
                                    class="markup-type-select">
                                    <option value="">None</option>
                                    <option value="$">$</option>
                                    <option value="%">%</option>
                                </select>
                                <div class="markup-input-container">
                                    <template if:true={isDefaultDollar}>
                                        <span class="currency-prefix">$</span>
                                    </template>
                                    <input 
                                        type="number" 
                                        name="default-term-markup"
                                        value={defaultTermMarkup}
                                        onchange={handleDefaultTermMarkupChange}
                                        class="markup-input"
                                        placeholder="0.00"
                                        step="0.01"
                                        min="0">
                                </div>
                            </div>
                        </div>
                        <lightning-button 
                            label="Apply to All Terms" 
                            variant="brand" 
                            onclick={applyDefaultTermMarkup}
                            class="bulk-button">
                        </lightning-button>
                    </div>
                    <div class="bulk-form" style="margin-top: 20px;">
                        <div class="form-group">
                            <label class="form-label">Default Option Markup</label>
                            <div class="markup-input-row">
                                <select 
                                    name="default-option-markup-type"
                                    onchange={handleDefaultOptionMarkupTypeChange}
                                    class="markup-type-select">
                                    <option value="">None</option>
                                    <option value="$">$</option>
                                    <option value="%">%</option>
                                </select>
                                <div class="markup-input-container">
                                    <template if:true={isDefaultDollar}>
                                        <span class="currency-prefix">$</span>
                                    </template>
                                    <input 
                                        type="number" 
                                        name="default-option-markup"
                                        value={defaultOptionMarkup}
                                        onchange={handleDefaultOptionMarkupChange}
                                        class="markup-input"
                                        placeholder="0.00"
                                        step="0.01"
                                        min="0">
                                </div>
                            </div>
                        </div>
                        <lightning-button 
                            label="Apply to All Options" 
                            variant="brand" 
                            onclick={applyDefaultOptionMarkup}
                            class="bulk-button">
                        </lightning-button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Packages Section -->
        <div class="packages-section">
            <!-- Loading State -->
            <template if:true={isLoading}>
                <div class="loading-container">
                    <lightning-spinner alternative-text="Loading packages..." size="medium"></lightning-spinner>
                    <p class="loading-text">Loading packages...</p>
                </div>
            </template>
            
            <!-- Error State -->
            <template if:true={error}>
                <div class="error-container">
                    <lightning-icon icon-name="utility:error" size="medium" class="error-icon"></lightning-icon>
                    <h3 class="error-title">Error loading packages</h3>
                    <p class="error-message">{error}</p>
                </div>
            </template>
            
            <!-- Record Type Sections -->
            <template if:false={isLoading}>
                <template if:true={noPackagesAvailable}>
                    <div class="no-packages-container">
                        <lightning-icon icon-name="utility:info" size="medium" class="info-icon"></lightning-icon>
                        <h3 class="no-packages-title">No Packages Available</h3>
                        <p class="no-packages-message">There are currently no packages to manage.</p>
                    </div>
                </template>
                
                <template if:false={noPackagesAvailable}>
                    <template for:each={packagesByRecordType} for:item="recordTypeGroup">
                        <div key={recordTypeGroup.recordType} class="record-type-section">
                            <div class="record-type-header">
                                <h2 class="record-type-title">{recordTypeGroup.recordType}</h2>
                                <span class="record-type-count">{recordTypeGroup.packages.length} Package(s)</span>
                            </div>
                            
                            <div class="record-type-content">
                                <template for:each={recordTypeGroup.packages} for:item="pkg">
                                    <div key={pkg.Id} class="accordion-item">
                                        <div class="accordion-header" onclick={togglePackage} data-package-id={pkg.Id}>
                                            <div class="accordion-title">
                                                <h3 class="package-name">{pkg.PackageName}</h3>
                                                <span class="package-count">
                                                    <template if:true={pkg.terms.length}>{pkg.terms.length} Terms</template>
                                                    <template if:true={pkg.directAdditionalOptions.length}>{pkg.directAdditionalOptions.length} Direct Options</template>
                                                </span>
                                            </div>
                                            <div class="accordion-toggle">
                                                <lightning-icon icon-name={pkg.toggleIcon} size="small"></lightning-icon>
                                            </div>
                                        </div>
                                        
                                        <div if:true={pkg.isVisible} class="accordion-content">
                                            <!-- Package Level Update Section -->
                                            <template if:true={pkg.terms.length}>
                                                <div class="package-update-section">
                                                    <div class="package-update-header">
                                                        <h4 class="package-update-title">Update All Terms in {pkg.PackageName}</h4>
                                                    </div>
                                                    <div class="package-update-form">
                                                        <div class="form-group">
                                                            <label class="form-label">Package Markup</label>
                                                            <div class="markup-input-row">
                                                                <select 
                                                                    name="package-markup-type"
                                                                    data-package-id={pkg.Id}
                                                                    onchange={handlePackageMarkupTypeChange}
                                                                    class="markup-type-select">
                                                                    <option value="">None</option>
                                                                    <option value="$">$</option>
                                                                    <option value="%">%</option>
                                                                </select>
                                                                <div class="markup-input-container">
                                                                    <template if:true={pkg.packageMarkupType}>
                                                                        <span class="currency-prefix">{pkg.packageMarkupType}</span>
                                                                    </template>
                                                                    <input 
                                                                        type="number" 
                                                                        data-package-id={pkg.Id}
                                                                        value={pkg.packageMarkup}
                                                                        onchange={handlePackageMarkupChange}
                                                                        onkeydown={handleMarkupKeydown}
                                                                        class="markup-input"
                                                                        placeholder="0.00"
                                                                        step="0.01"
                                                                        min="0">
                                                                </div>
                                                            </div>
                                                        </div>
                                                        <lightning-button 
                                                            variant="brand" 
                                                            label="Update All Terms"
                                                            data-package-id={pkg.Id}
                                                            onclick={updatePackageMarkup}
                                                            class="package-update-button">
                                                        </lightning-button>
                                                    </div>
                                                </div>
                                            </template>
                                            
                                            <!-- Extended Limited Warranty: Terms with Additional Options -->
                                            <template if:false={pkg.isTotalLoss}>
                                                <template for:each={pkg.terms} for:item="term">
                                                    <div key={term.Id} class="term-item">
                                                        <div class="term-info">
                                                            <div class="term-header">
                                                                <h4 class="term-name">{term.termName}</h4>
                                                            </div>
                                                            
                                                            <div class="pricing-row">
                                                                <div class="price-group">
                                                                    <label class="price-label">Base Cost</label>
                                                                    <div class="price-value">${term.netCost}</div>
                                                                </div>
                                                                
                                                                <div class="price-group">
                                                                    <label class="price-label">Markup</label>
                                                                    <div class="markup-input-row">
                                                                        <select 
                                                                            name="markup-type"
                                                                            data-term-id={term.Id}
                                                                            onchange={handleTermMarkupTypeChange}
                                                                            class="markup-type-select">
                                                                            <option value="">None</option>
                                                                            <option value="$">$</option>
                                                                            <option value="%">%</option>
                                                                        </select>
                                                                        <div class="markup-input-container">
                                                                            <template if:true={term.markupType}>
                                                                                <span class="currency-prefix">{term.markupType}</span>
                                                                            </template>
                                                                            <input 
                                                                                type="number" 
                                                                                data-term-id={term.Id}
                                                                                value={term.markup}
                                                                                onchange={handleTermMarkupChange}
                                                                                onkeydown={handleMarkupKeydown}
                                                                                class="markup-input"
                                                                                placeholder="0.00"
                                                                                step="0.01"
                                                                                min="0">
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                                
                                                                <div class="price-group">
                                                                    <label class="price-label">Total Price</label>
                                                                    <div class="price-value total">${term.totalPrice}</div>
                                                                </div>
                                                                
                                                                <div class="action-group">
                                                                    <lightning-button 
                                                                        variant="brand" 
                                                                        label="Update"
                                                                        data-term-id={term.Id}
                                                                        onclick={updateTermMarkupApex}
                                                                        class="update-button">
                                                                    </lightning-button>
                                                                </div>
                                                            </div>
                                                        </div>
                                                        
                                                        <!-- Additional Options Sub-Accordion -->
                                                        <template if:true={term.additionalOptions.length}>
                                                            <div class="options-sub-accordion">
                                                                <div class="options-sub-accordion-header" onclick={toggleOptions} data-term-id={term.Id}>
                                                                    <div class="options-sub-accordion-title">
                                                                        <h5 class="options-sub-title">Additional Options ({term.additionalOptions.length})</h5>
                                                                    </div>
                                                                    <div class="options-sub-accordion-toggle">
                                                                        <lightning-icon icon-name={term.optionsToggleIcon} size="small"></lightning-icon>
                                                                    </div>
                                                                </div>
                                                                
                                                                <div if:true={term.isOptionsVisible} class="options-sub-accordion-content">
                                                                    <!-- Term Level Bulk Update for Options -->
                                                                    <div class="term-options-update-section">
                                                                        <div class="term-options-update-header">
                                                                            <h6 class="term-options-update-title">Update All Options in {term.termName}</h6>
                                                                        </div>
                                                                        <div class="term-options-update-form">
                                                                            <div class="form-group">
                                                                                <label class="form-label">Option Markup ($)</label>
                                                                                <div class="markup-input-container">
                                                                                    <span class="currency-prefix">$</span>
                                                                                    <input 
                                                                                        type="number" 
                                                                                        data-term-id={term.Id}
                                                                                        data-markup="0"
                                                                                        onchange={handleTermOptionsMarkupChange}
                                                                                        onkeydown={handleMarkupKeydown}
                                                                                        class="markup-input"
                                                                                        placeholder="0.00"
                                                                                        step="0.01"
                                                                                        min="0">
                                                                                </div>
                                                                            </div>
                                                                            <lightning-button 
                                                                                variant="brand" 
                                                                                label="Update All Options"
                                                                                data-term-id={term.Id}
                                                                                onclick={updateTermOptionsMarkup}
                                                                                class="term-options-update-button">
                                                                            </lightning-button>
                                                                        </div>
                                                                    </div>
                                                                    
                                                                    <!-- Options List -->
                                                                    <template for:each={term.additionalOptions} for:item="option">
                                                                        <div key={option.Id} class="option-item">
                                                                            <div class="option-info">
                                                                                <div class="option-header">
                                                                                    <h5 class="option-name">{option.optionName}</h5>
                                                                                </div>
                                                                                
                                                                                <div class="pricing-row">
                                                                                    <div class="price-group">
                                                                                        <label class="price-label">Base Cost</label>
                                                                                        <div class="price-value">${option.netCost}</div>
                                                                                    </div>
                                                                                    
                                                                                    <div class="price-group">
                                                                                        <label class="price-label">Markup</label>
                                                                                        <div class="markup-input-row">
                                                                                            <select 
                                                                                                name="option-markup-type"
                                                                                                data-option-id={option.Id}
                                                                                                onchange={handleOptionMarkupTypeChange}
                                                                                                class="markup-type-select">
                                                                                                <option value="">None</option>
                                                                                                <option value="$">$</option>
                                                                                                <option value="%">%</option>
                                                                                            </select>
                                                                                            <div class="markup-input-container">
                                                                                                <template if:true={option.isDollar}>
                                                                                                    <span class="currency-prefix">$</span>
                                                                                                </template>
                                                                                                <template if:true={option.isDollar}>
                                                                                                    <input 
                                                                                                        type="number" 
                                                                                                        data-option-id={option.Id}
                                                                                                        value={option.dealerMarkup}
                                                                                                        onchange={handleOptionMarkupChange}
                                                                                                        onkeydown={handleMarkupKeydown}
                                                                                                        class="markup-input"
                                                                                                        placeholder="0.00"
                                                                                                        step="0.01"
                                                                                                        min="0">
                                                                                                </template>
                                                                                                <template if:false={option.isDollar}>
                                                                                                    <input 
                                                                                                        type="number" 
                                                                                                        data-option-id={option.Id}
                                                                                                        value={option.dealerMarkup}
                                                                                                        onchange={handleOptionMarkupChange}
                                                                                                        onkeydown={handleMarkupKeydown}
                                                                                                        class="markup-input"
                                                                                                        placeholder="0"
                                                                                                        step="1"
                                                                                                        min="0">
                                                                                                </template>
                                                                                            </div>
                                                                                        </div>
                                                                                    </div>
                                                                                    
                                                                                    <div class="price-group">
                                                                                        <label class="price-label">Total Price</label>
                                                                                        <div class="price-value total">${option.totalPrice}</div>
                                                                                    </div>
                                                                                    
                                                                                    <div class="action-group">
                                                                                        <lightning-button 
                                                                                            variant="brand" 
                                                                                            label="Update"
                                                                                            data-option-id={option.Id}
                                                                                            onclick={updateOptionMarkupApex}
                                                                                            class="update-button">
                                                                                        </lightning-button>
                                                                                    </div>
                                                                                </div>
                                                                            </div>
                                                                        </div>
                                                                    </template>
                                                                </div>
                                                            </div>
                                                        </template>
                                                    </div>
                                                </template>
                                            </template>
                                            
                                            <!-- Total Loss: Separate Sections -->
                                            <template if:true={pkg.isTotalLoss}>
                                                <!-- Terms Section -->
                                                <template if:true={pkg.terms.length}>
                                                    <div class="section-divider">
                                                        <h4 class="section-title">Terms</h4>
                                                    </div>
                                                    <template for:each={pkg.terms} for:item="term">
                                                        <div key={term.Id} class="term-item">
                                                            <div class="term-info">
                                                                <div class="term-header">
                                                                    <h4 class="term-name">{term.termName}</h4>
                                                                </div>
                                                                
                                                                <div class="pricing-row">
                                                                    <div class="price-group">
                                                                        <label class="price-label">Base Cost</label>
                                                                        <div class="price-value">${term.netCost}</div>
                                                                    </div>
                                                                    
                                                                    <div class="price-group">
                                                                        <label class="price-label">Markup</label>
                                                                        <div class="markup-input-row">
                                                                            <select 
                                                                                name="markup-type"
                                                                                data-term-id={term.Id}
                                                                                onchange={handleTermMarkupTypeChange}
                                                                                class="markup-type-select">
                                                                                <option value="">None</option>
                                                                                <option value="$">$</option>
                                                                                <option value="%">%</option>
                                                                            </select>
                                                                            <div class="markup-input-container">
                                                                                <template if:true={term.markupType}>
                                                                                    <span class="currency-prefix">{term.markupType}</span>
                                                                                </template>
                                                                                <input 
                                                                                    type="number" 
                                                                                    data-term-id={term.Id}
                                                                                    value={term.markup}
                                                                                    onchange={handleTermMarkupChange}
                                                                                    onkeydown={handleMarkupKeydown}
                                                                                    class="markup-input"
                                                                                    placeholder="0.00"
                                                                                    step="0.01"
                                                                                    min="0">
                                                                            </div>
                                                                        </div>
                                                                    </div>
                                                                    
                                                                    <div class="price-group">
                                                                        <label class="price-label">Total Price</label>
                                                                        <div class="price-value total">${term.totalPrice}</div>
                                                                    </div>
                                                                    
                                                                    <div class="action-group">
                                                                        <lightning-button 
                                                                            variant="brand" 
                                                                            label="Update"
                                                                            data-term-id={term.Id}
                                                                            onclick={updateTermMarkupApex}
                                                                            class="update-button">
                                                                        </lightning-button>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </template>
                                                </template>
                                                
                                                <!-- Categories Section -->
                                                <template if:true={pkg.categories.length}>
                                                    <div class="section-divider">
                                                        <h4 class="section-title">Categories</h4>
                                                    </div>
                                                    <template for:each={pkg.categories} for:item="category">
                                                        <div key={category.categoryName} class="category-accordion-item">
                                                            <div class="category-accordion-header" onclick={toggleCategory} data-category-name={category.categoryName}>
                                                                <div class="category-accordion-title">
                                                                    <h4 class="category-name">{category.categoryName}</h4>
                                                                    <div class="category-badge">
                                                                        <span class="option-count">{category.options.length} Option(s)</span>
                                                                    </div>
                                                                </div>
                                                                <div class="category-accordion-toggle">
                                                                    <lightning-icon icon-name={category.toggleIcon} size="small"></lightning-icon>
                                                                </div>
                                                            </div>
                                                            
                                                            <div if:true={category.isVisible} class="category-accordion-content">
                                                                <template for:each={category.options} for:item="option">
                                                                    <div key={option.Id} class="option-item">
                                                                        <div class="option-info">
                                                                            <div class="option-header">
                                                                                <h5 class="option-name">{option.optionName}</h5>
                                                                            </div>
                                                                            
                                                                            <div class="pricing-row">
                                                                                <div class="price-group">
                                                                                    <label class="price-label">Base Cost</label>
                                                                                    <div class="price-value">${option.netCost}</div>
                                                                                </div>
                                                                                
                                                                                <div class="price-group">
                                                                                    <label class="price-label">Markup</label>
                                                                                    <div class="markup-input-row">
                                                                                        <select 
                                                                                            name="option-markup-type"
                                                                                            data-option-id={option.Id}
                                                                                            onchange={handleOptionMarkupTypeChange}
                                                                                            class="markup-type-select">
                                                                                            <option value="">None</option>
                                                                                            <option value="$">$</option>
                                                                                            <option value="%">%</option>
                                                                                        </select>
                                                                                        <div class="markup-input-container">
                                                                                            <template if:true={option.isDollar}>
                                                                                                <span class="currency-prefix">$</span>
                                                                                            </template>
                                                                                            <template if:true={option.isDollar}>
                                                                                                <input 
                                                                                                    type="number" 
                                                                                                    data-option-id={option.Id}
                                                                                                    value={option.dealerMarkup}
                                                                                                    onchange={handleOptionMarkupChange}
                                                                                                    onkeydown={handleMarkupKeydown}
                                                                                                    class="markup-input"
                                                                                                    placeholder="0.00"
                                                                                                    step="0.01"
                                                                                                    min="0">
                                                                                            </template>
                                                                                            <template if:false={option.isDollar}>
                                                                                                <input 
                                                                                                    type="number" 
                                                                                                    data-option-id={option.Id}
                                                                                                    value={option.dealerMarkup}
                                                                                                    onchange={handleOptionMarkupChange}
                                                                                                    onkeydown={handleMarkupKeydown}
                                                                                                    class="markup-input"
                                                                                                    placeholder="0"
                                                                                                    step="1"
                                                                                                    min="0">
                                                                                            </template>
                                                                                        </div>
                                                                                    </div>
                                                                                </div>
                                                                                
                                                                                <div class="price-group">
                                                                                    <label class="price-label">Total Price</label>
                                                                                    <div class="price-value total">${option.totalPrice}</div>
                                                                                </div>
                                                                                
                                                                                <div class="action-group">
                                                                                    <lightning-button 
                                                                                        variant="brand" 
                                                                                        label="Update"
                                                                                        data-option-id={option.Id}
                                                                                        onclick={updateOptionMarkupApex}
                                                                                        class="update-button">
                                                                                    </lightning-button>
                                                                                </div>
                                                                            </div>
                                                                        </div>
                                                                    </div>
                                                                </template>
                                                            </div>
                                                        </div>
                                                    </template>
                                                </template>
                                                
                                                <!-- Additional Options Section (Total Loss) -->
                                                <template if:true={pkg.directAdditionalOptions.length}>
                                                    <div class="section-divider">
                                                        <h4 class="section-title">Additional Options</h4>
                                                    </div>
                                                    <div class="total-loss-options-accordion">
                                                        <div class="total-loss-options-header" onclick={toggleTotalLossOptions} data-package-id={pkg.Id}>
                                                            <div class="total-loss-options-title">
                                                                <h4 class="total-loss-options-name">All Additional Options ({pkg.directAdditionalOptions.length})</h4>
                                                            </div>
                                                            <div class="total-loss-options-toggle">
                                                                <lightning-icon icon-name={pkg.totalLossOptionsToggleIcon} size="small"></lightning-icon>
                                                            </div>
                                                        </div>
                                                        
                                                        <div if:true={pkg.isTotalLossOptionsVisible} class="total-loss-options-content">
                                                            <!-- Bulk Update for Total Loss Options -->
                                                            <div class="total-loss-options-update-section">
                                                                <div class="total-loss-options-update-header">
                                                                    <h5 class="total-loss-options-update-title">Update All Additional Options</h5>
                                                                </div>
                                                                <div class="total-loss-options-update-form">
                                                                    <div class="form-group">
                                                                        <label class="form-label">Option Markup ($)</label>
                                                                        <div class="markup-input-container">
                                                                            <span class="currency-prefix">$</span>
                                                                            <input 
                                                                                type="number" 
                                                                                data-package-id={pkg.Id}
                                                                                data-markup="0"
                                                                                onchange={handleTotalLossOptionsMarkupChange}
                                                                                onkeydown={handleMarkupKeydown}
                                                                                class="markup-input"
                                                                                placeholder="0.00"
                                                                                step="0.01"
                                                                                min="0">
                                                                        </div>
                                                                    </div>
                                                                    <lightning-button 
                                                                        variant="brand" 
                                                                        label="Update All Options"
                                                                        data-package-id={pkg.Id}
                                                                        onclick={updateTotalLossOptionsMarkup}
                                                                        class="total-loss-options-update-button">
                                                                    </lightning-button>
                                                                </div>
                                                            </div>
                                                            
                                                            <!-- Options List -->
                                                            <template for:each={pkg.directAdditionalOptions} for:item="option">
                                                                <div key={option.Id} class="option-item">
                                                                    <div class="option-info">
                                                                        <div class="option-header">
                                                                            <h5 class="option-name">{option.optionName}</h5>
                                                                        </div>
                                                                        
                                                                        <div class="pricing-row">
                                                                            <div class="price-group">
                                                                                <label class="price-label">Base Cost</label>
                                                                                <div class="price-value">${option.netCost}</div>
                                                                            </div>
                                                                            
                                                                            <div class="price-group">
                                                                                <label class="price-label">Markup</label>
                                                                                <div class="markup-input-row">
                                                                                    <select 
                                                                                        name="option-markup-type"
                                                                                        data-option-id={option.Id}
                                                                                        onchange={handleOptionMarkupTypeChange}
                                                                                        class="markup-type-select">
                                                                                        <option value="">None</option>
                                                                                        <option value="$">$</option>
                                                                                        <option value="%">%</option>
                                                                                    </select>
                                                                                    <div class="markup-input-container">
                                                                                        <template if:true={option.isDollar}>
                                                                                            <span class="currency-prefix">$</span>
                                                                                        </template>
                                                                                        <template if:true={option.isDollar}>
                                                                                            <input 
                                                                                                type="number" 
                                                                                                data-option-id={option.Id}
                                                                                                value={option.dealerMarkup}
                                                                                                onchange={handleOptionMarkupChange}
                                                                                                onkeydown={handleMarkupKeydown}
                                                                                                class="markup-input"
                                                                                                placeholder="0.00"
                                                                                                step="0.01"
                                                                                                min="0">
                                                                                        </template>
                                                                                        <template if:false={option.isDollar}>
                                                                                            <input 
                                                                                                type="number" 
                                                                                                data-option-id={option.Id}
                                                                                                value={option.dealerMarkup}
                                                                                                onchange={handleOptionMarkupChange}
                                                                                                onkeydown={handleMarkupKeydown}
                                                                                                class="markup-input"
                                                                                                placeholder="0"
                                                                                                step="1"
                                                                                                min="0">
                                                                                        </template>
                                                                                    </div>
                                                                                </div>
                                                                            </div>
                                                                            
                                                                            <div class="price-group">
                                                                                <label class="price-label">Total Price</label>
                                                                                <div class="price-value total">${option.totalPrice}</div>
                                                                            </div>
                                                                            
                                                                            <div class="action-group">
                                                                                <lightning-button 
                                                                                    variant="brand" 
                                                                                    label="Update"
                                                                                    data-option-id={option.Id}
                                                                                    onclick={updateOptionMarkupApex}
                                                                                    class="update-button">
                                                                                </lightning-button>
                                                                            </div>
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            </template>
                                                        </div>
                                                    </div>
                                                </template>
                                            </template>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>
                </template>
            </template>
        </div>
    </div>
</template>
