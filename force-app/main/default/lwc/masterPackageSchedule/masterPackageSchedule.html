<template><template lwc:if={open}><section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open"><div class="slds-modal__container ap-modal ap-modal_lg"><header class="slds-modal__header"><h2 class="slds-text-heading_medium">{titleLabel}</h2><p class="ap-modal-sub">{subtitleLabel}</p><button class="ap-x" type="button" onclick={handleClose} title="Close">&#10005;</button></header><div class="slds-modal__content slds-p-around_medium ap-modal-body"><template lwc:if={notice}><div class="ap-toast ap-toast_ok" role="status"><span>{notice}</span><button class="ap-toast-x" type="button" onclick={handleDismissNotice}>&#10005;</button></div></template><template lwc:if={errorMessage}><div class="ap-form-error" role="alert">{errorMessage}</div></template><div class="ap-toolbar"><template lwc:if={isList}><input class="ap-input ap-search" type="search" placeholder="Search schedules by name…" value={searchKey} onchange={handleSearch} onkeyup={handleSearchSubmit}/><button class="ap-btn ap-btn_sm" type="button" onclick={handleSearchSubmit}>Search</button></template><template lwc:elif={isContext}><button class="ap-btn ap-btn_sm" type="button" onclick={handleBrowse}>&#8249; Browse all schedules</button></template><template lwc:else><button class="ap-btn ap-btn_sm" type="button" onclick={handleBack}>&#8249; Back</button></template><span class="ap-spacer"></span><button class="ap-btn ap-btn_primary ap-btn_sm" type="button" onclick={handleNewSchedule}>+ New Schedule</button></div><template lwc:if={isList}><p class="ap-sub">{schedulePage.total} schedule(s) in the master library. Open one to manage its members and assignments.</p><template lwc:if={hasSchedules}><table class="ap-table"><thead><tr><th>Schedule</th><th>Type</th><th>Validity</th><th>Contents</th><th class="ap-act-col">Actions</th></tr></thead><tbody><template for:each={schedulePage.rows} for:item="s"><tr key={s.id}><td><button class="ap-link" type="button" data-id={s.id} onclick={openSchedule}>{s.name}</button><template lwc:if={s.isActive}><span class="ap-pill ap-pill_ok">{s.statusLabel}</span></template><template lwc:else><span class="ap-pill ap-pill_muted">{s.statusLabel}</span></template></td><td>{s.typeLabel}</td><td>{s.validFromLabel} &rarr; {s.validToLabel}</td><td>{s.summaryLabel}</td><td class="ap-act-col"><button class="ap-btn ap-btn_xs" type="button" data-id={s.id} onclick={openSchedule}>Manage</button><button class="ap-btn ap-btn_xs" type="button" data-id={s.id} onclick={handleEditSchedule}>Edit</button><template lwc:if={s.isActive}><button class="ap-btn ap-btn_xs" type="button" data-id={s.id} onclick={handleToggleSchedule}>Deactivate</button></template><template lwc:else><button class="ap-btn ap-btn_xs" type="button" data-id={s.id} onclick={handleToggleSchedule}>Activate</button></template></td></tr></template></tbody></table><template lwc:if={schedulePage.hasMore}><button class="ap-btn ap-btn_sm" type="button" onclick={handleLoadMoreSchedules}>Load more schedules</button></template></template><template lwc:else><p class="ap-sub">No vehicle schedules found.</p></template></template><template lwc:if={isContext}><div class="ap-section-head"><p class="ap-eyebrow">Assignments bound to this {context.contextType}</p><button class="ap-btn ap-btn_primary ap-btn_sm" type="button" onclick={handleNewAssignment}>+ Assign a schedule</button></div><template lwc:if={hasAssignments}><table class="ap-table"><thead><tr><th>Vehicle Schedule</th><th>Type</th><th>Target</th><th>Effective</th><th class="ap-act-col">Actions</th></tr></thead><tbody><template for:each={context.assignments} for:item="a"><tr key={a.id}><td>{a.scheduleName}</td><td>{a.scheduleTypeLabel}</td><td>{a.targetType}: {a.targetName}</td><td>{a.windowLabel}</td><td class="ap-act-col"><button class="ap-btn ap-btn_xs" type="button" data-id={a.scheduleId} onclick={openSchedule}>Open schedule</button><button class="ap-btn ap-btn_xs" type="button" data-id={a.id} onclick={handleEditAssignment}>Edit</button><button class="ap-btn ap-btn_xs ap-btn_danger" type="button" data-id={a.id} onclick={handleDeleteAssignment}>Remove</button></td></tr></template></tbody></table></template><template lwc:else><p class="ap-sub">No vehicle schedule is assigned to this {context.contextType} yet.</p></template></template><template lwc:if={isDetail}><div class="ap-section-head"><div><p class="ap-eyebrow">{detail.typeLabel} &middot; {detail.statusLabel}</p><p class="ap-sub">Valid {detail.validFromLabel} &rarr; {detail.validToLabel}</p></div></div><div class="ap-actions"><button class="ap-btn ap-btn_sm" type="button" data-id={detail.id} onclick={handleEditSchedule}>Edit schedule</button><template lwc:if={detail.isActive}><button class="ap-btn ap-btn_sm" type="button" data-id={detail.id} onclick={handleToggleSchedule}>Deactivate</button></template><template lwc:else><button class="ap-btn ap-btn_sm" type="button" data-id={detail.id} onclick={handleToggleSchedule}>Activate</button></template></div><div class="ap-section-head"><p class="ap-eyebrow">Members ({detail.memberTotal})</p><button class="ap-btn ap-btn_primary ap-btn_sm" type="button" onclick={handleNewMember}>+ Add member</button></div><template lwc:if={hasDetailMembers}><table class="ap-table"><thead><tr><th>Vehicle</th><th>Effect</th><th>Tier / Class</th><th>Key</th><th class="ap-act-col">Actions</th></tr></thead><tbody><template for:each={detail.members} for:item="m"><tr key={m.id}><td>{m.vehicleLabel}</td><td>{m.effectLabel}</td><td>{m.flagsLabel}</td><td class="ap-key">{m.memberKey}</td><td class="ap-act-col"><button class="ap-btn ap-btn_xs" type="button" data-id={m.id} onclick={handleEditMember}>Edit</button><button class="ap-btn ap-btn_xs" type="button" data-id={m.id} onclick={handleMoveMember}>Move</button><button class="ap-btn ap-btn_xs ap-btn_danger" type="button" data-id={m.id} onclick={handleDeleteMember}>Remove</button></td></tr></template></tbody></table><template lwc:if={detail.membersHaveMore}><button class="ap-btn ap-btn_sm" type="button" onclick={handleLoadMoreMembers}>Load more members</button></template></template><template lwc:else><p class="ap-sub">This schedule has no members yet.</p></template><div class="ap-section-head"><p class="ap-eyebrow">Assignments ({detail.assignmentTotal})</p><button class="ap-btn ap-btn_sm" type="button" onclick={handleNewAssignment}>+ Assign to a package or group</button></div><template lwc:if={hasDetailAssignments}><table class="ap-table"><thead><tr><th>Target</th><th>Effective</th><th class="ap-act-col">Actions</th></tr></thead><tbody><template for:each={detail.assignments} for:item="a"><tr key={a.id}><td>{a.targetType}: {a.targetName}</td><td>{a.windowLabel}</td><td class="ap-act-col"><button class="ap-btn ap-btn_xs" type="button" data-id={a.id} onclick={handleEditAssignment}>Edit</button><button class="ap-btn ap-btn_xs ap-btn_danger" type="button" data-id={a.id} onclick={handleDeleteAssignment}>Remove</button></td></tr></template></tbody></table></template><template lwc:else><p class="ap-sub">This schedule is not assigned to any package or group.</p></template></template><template lwc:if={loading}><p class="ap-sub">Loading…</p></template></div><footer class="slds-modal__footer ap-modal-footer"><button class="ap-btn" type="button" onclick={handleClose}>Close</button></footer></div></section><div class="slds-backdrop slds-backdrop_open"></div></template><c-master-package-schedule-editor onwritten={handleWritten} onwriteerror={handleWrittenError}></c-master-package-schedule-editor></template>
