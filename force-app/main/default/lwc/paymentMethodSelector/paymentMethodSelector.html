                    <div class="payment-details">
                        <h3 class="slds-text-heading_small slds-m-bottom_x-small">
                            <u>Credit Card Payment Online</u>
                            <div class="card-logos">
                                <img src={staticResources.cardsIcons} alt="Visa and Mastercard" class="card-icon"/>
                            </div>
                        </h3>
                    </div>
                </div>
            </div>

            <!-- Cheque Payment Option -->
            <div class="payment-option-card" onclick={handleSelectCheque}>
                <div class="payment-option-content">
                    <div class="payment-icon">
                        <img src={staticResources.chequePayment} alt="chequePayment"/>
                    </div>
                    <div class="payment-details">
                        <h3 class="slds-text-heading_small slds-m-bottom_x-small">
                            <u>Cheque</u>
                        </h3>
                        <p class="slds-text-body_small slds-m-bottom_none">
                            Mail a cheque to A-Protect Warranty 8800 Dufferin St. Suite 302B Concord, ON L4K 0C5 and reference the Remittance Form ID #
                        </p>
                    </div>
                </div>
            </div>

            <!-- E-transfer Payment Option -->
            <div class="payment-option-card" onclick={handleSelectETransfer}>
                <div class="payment-option-content">
                    <div class="payment-icon">
                         <img src={staticResources.eTransfer} alt="eTransfer"/>
                    </div>
                    <div class="payment-details">
                        <h3 class="slds-text-heading_small slds-m-bottom_x-small">
                            <u>View Interact E-transfer</u>
                        </h3>
                        <p class="slds-text-body_small slds-m-bottom_none">
                            Send an e-transfer to <strong>payments@a-protectwarranty.com</strong> and reference the Remittance Form ID #
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </template>
