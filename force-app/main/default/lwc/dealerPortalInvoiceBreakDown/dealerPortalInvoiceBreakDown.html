<template>
    <template if:true={isLoading}>
        <div class="slds-p-around_medium">
            <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
        </div>
    </template>

    <template if:false={isLoading}>
        <template if:true={invoiceData}>
            <div class="remittance-modal-content">

                <!-- Check Pending Verification Warning Banner -->
                <template if:true={invoiceData.hasCheckPendingVerification}>
                    <div class="check-pending-banner">
                        <span class="check-pending-icon">⚠️</span>
                        <span class="check-pending-text">A check payment is pending verification. Invoices cannot be added or removed until the check is verified by the admin team.</span>
                    </div>
                </template>

                <!-- Title and Actions Header -->
                <div class="header-section">
                    <div class="header-left">
                        <h1 class="remittance-form-title">
                            REMITTANCE ID#: {invoiceData.remittanceFormName}
                        </h1>
                        <template if:true={invoiceData.hasRemittanceDate}>
                            <div class="remittance-date-pill">
                                <lightning-icon icon-name="utility:event" size="xx-small" class="pill-icon"></lightning-icon>
                                <span>Remittance Date: {invoiceData.formattedRemittanceDate}</span>
                            </div>
                        </template>
                        <template if:true={invoiceData.isAllocationRemittance}>
                            <p class="services-label">Services: {invoiceData.selectedServiceLabels}</p>
                        </template>
                    </div>
                    <div class="header-right-block">
                        <div class="header-actions">
                            <template if:true={invoiceData.canModifyInvoices}>
                                <lightning-button
                                    variant="neutral"
                                    label="Add Invoice"
                                    icon-name="utility:add"
                                    onclick={handleOpenAddInvoice}
                                    class="slds-m-right_small">
                                </lightning-button>
                            </template>
                            <lightning-button
                                variant="brand"
                                label="Download PDF"
                                icon-name="utility:download"
                                onclick={handleDownloadPDF}>
                            </lightning-button>
                        </div>
                        <template if:true={invoiceData.hasDateGenerated}>
                            <div class="date-generated-block">
                                <span class="date-generated-label">Date Generated:</span>
                                <span class="date-generated-value">{invoiceData.formattedDateGenerated}</span>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- Remittance Form Details -->
                <div class="remittance-details-grid">
                    <div>
                        <div class="field-container">
                            <strong class="field-label">Dealer Name</strong>
                            <div>{invoiceData.dealerName}</div>
                        </div>
                        <div class="field-container">
                            <strong class="field-label">Status</strong>
                            <div><span class={invoiceData.statusBadgeClass}>{invoiceData.status}</span></div>
                        </div>
                        <template if:true={invoiceData.isCancelled}>
                            <div class="field-container">
                                <strong class="field-label">Cancelation Reason</strong>
                                <div>{invoiceData.cancellationReason}</div>
                            </div>
                        </template>
                    </div>
                    <div>
                        <div class="field-container">
                            <strong class="field-label">Bill To</strong>
                            <div data-id="billToContent" class="rich-text-field"></div>
                        </div>
                        <div class="field-container">
                            <strong class="field-label">Receiver Name</strong>
                            <div>{invoiceData.receiverName}</div>
                        </div>
                        <div class="field-container">
                            <strong class="field-label">Payer Name</strong>
                            <div>{invoiceData.payerName}</div>
                        </div>
                    </div>
                </div>

                <!-- Credit Information -->
                <div class="credit-info-section">
                    <h3 class="credit-info-heading">Credit Information</h3>
                    <div class="remittance-details-grid">
                        <div>
                            <div class="field-container">
                                <strong class="field-label">Credit Issued By</strong>
                                <div>{invoiceData.creditIssuedBy}</div>
                            </div>
                            <template if:true={invoiceData.hasAvailableCredit}>
                                <div class="field-container">
                                    <strong class="field-label">Available Credit</strong>
                                    <div class="available-credit-value">{invoiceData.formattedAvailableCredit}</div>
                                    <p class="available-credit-note">Contact the office to request credit to be applied on this remittance.</p>
                                </div>
                            </template>
                        </div>
                        <div>
                            <div class="field-container">
                                <strong class="field-label">Credit Note</strong>
                                <lightning-formatted-rich-text value={invoiceData.creditNote}></lightning-formatted-rich-text>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ── DETAILS Section Banner ───────────────────────── -->
                <div class="details-banner">
                    <span>DETAILS</span>
                </div>

                <!-- ── Invoice Cards (Collapsed/Expanded) ───────────── -->
                <div class="invoice-cards-container">
                    <template for:each={invoiceData.tableRows} for:item="row">
                        <div key={row.id} class="invoice-card">
                            <!-- Collapsed Strip -->
                            <div class="invoice-card-strip" data-id={row.id} onclick={handleToggleRow}>
                                <div class="strip-col-remove">
                                    <template if:true={row.canRemove}>
                                        <span class="remove-icon" data-id={row.id} onclick={handleRemoveInvoice}>⊖</span>
                                    </template>
                                </div>
                                <div class="strip-col">
                                    <span class="strip-label">APP ID</span>
                                    <a class="inv-link" data-id={row.applicationId} onclick={handleApplicationClick} href="#">{row.applicationNumber}</a>
                                </div>
                                <div class="strip-col">
                                    <span class="strip-label">CUSTOMER</span>
                                    <span class="strip-value">{row.customerName}</span>
                                </div>
                                <div class="strip-col">
                                    <span class="strip-label">VEHICLE</span>
                                    <span class="strip-value">{row.vehicleFullName}</span>
                                </div>
                                <div class="strip-col">
                                    <span class="strip-label">VIN #</span>
                                    <span class="strip-value">{row.vinDisplay}</span>
                                </div>
                                <div class="strip-col">
                                    <span class="strip-label">INVOICE #</span>
                                    <a class="inv-link" data-id={row.id} onclick={handleInvoiceClick} href="#">{row.invoiceName}</a>
                                </div>
                                <div class="strip-col">
                                    <span class="strip-label">BALANCE</span>
                                    <span class="strip-balance">{row.formattedSubTotal}</span>
                                </div>
                                <div class="strip-col-chevron">
                                    <span class="strip-chevron">{row.chevronIcon}</span>
                                </div>
                            </div>

                            <!-- Expanded Detail -->
                            <template if:true={row.isExpanded}>
                                <div class="invoice-card-detail">
                                    <div class="detail-grid">
                                        <!-- Left: Customer & Vehicle Info -->
                                        <div class="detail-left">
                                            <h4 class="detail-section-title">Customer Information</h4>
                                            <div class="detail-field">
                                                <span class="detail-label">Name:</span>
                                                <span>{row.customerName}</span>
                                            </div>
                                            <template if:true={row.customerAddress}>
                                                <div class="detail-field">
                                                    <span class="detail-label">Address:</span>
                                                    <span>{row.customerAddress}</span>
                                                </div>
                                            </template>
                                            <template if:true={row.customerPhone}>
                                                <div class="detail-field">
                                                    <span class="detail-label">Phone:</span>
                                                    <span>{row.customerPhone}</span>
                                                </div>
                                            </template>

                                            <h4 class="detail-section-title detail-section-gap">Vehicle Information</h4>
                                            <template if:true={row.vehicleFullName}>
                                                <div class="detail-field">
                                                    <span class="detail-label">Vehicle:</span>
                                                    <span>{row.vehicleFullName}</span>
                                                </div>
                                            </template>
                                            <template if:true={row.vinDisplay}>
                                                <div class="detail-field">
                                                    <span class="detail-label">VIN:</span>
                                                    <span>{row.vinDisplay}</span>
                                                </div>
                                            </template>
                                            <template if:true={row.hasOdometer}>
                                                <div class="detail-field">
                                                    <span class="detail-label">Odometer:</span>
                                                    <span>{row.odometerDisplay}</span>
                                                </div>
                                            </template>
                                            <template if:true={row.hasDeliveryDate}>
                                                <div class="detail-field">
                                                    <span class="detail-label">Vehicle Delivery Date:</span>
                                                    <span>{row.deliveryDate}</span>
                                                </div>
                                            </template>
                                        </div>

                                        <!-- Right: Package Breakdown -->
                                        <div class="detail-right">
                                            <h4 class="detail-section-title">Package Breakdown</h4>
                                            <div class="packages-header">
                                                <span class="pkg-header-name">Package</span>
                                                <span class="pkg-header-price">Dealer Price</span>
                                                <span class="pkg-header-subtotal">Subtotal (w/tax)</span>
                                            </div>
                                            <template for:each={row.packages} for:item="pkg">
                                                <div key={pkg.key} class="package-row">
                                                    <div class="pkg-info">
                                                        <span class="pkg-name">{pkg.packageName}</span>
                                                        <template if:true={pkg.packageTierName}>
                                                            <span class="pkg-type">{pkg.packageTierName}</span>
                                                        </template>
                                                        <template if:false={pkg.packageTierName}>
                                                            <template if:true={pkg.packageRecordType}>
                                                                <span class="pkg-type">{pkg.packageRecordType}</span>
                                                            </template>
                                                        </template>
                                                        <template if:true={pkg.hasDuration}>
                                                            <span class="pkg-duration">{pkg.duration}</span>
                                                        </template>
                                                        <template if:true={pkg.hasAddOns}>
                                                            <div class="pkg-addons">
                                                                <span class="pkg-addons-label">Add-Ons:</span>
                                                                <template for:each={pkg.addOns} for:item="addon">
                                                                    <span key={addon.key} class="pkg-addon-item">{addon.optionName} ({addon.formattedCostPrice})</span>
                                                                </template>
                                                            </div>
                                                        </template>
                                                    </div>
                                                    <span class="pkg-dealer-price">{pkg.formattedDealerPrice}</span>
                                                    <span class="pkg-subtotal">{pkg.formattedSubtotalWithTax}</span>
                                                </div>
                                            </template>
                                        </div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>
                </div>

                <!-- Summary Section -->
                <div class="remittance-summary">
                    <div class="summary-section">
                        <div class="summary-row total-row">
                            <span class="summary-label">Remittance Form Total:</span>
                            <span class="summary-value">{invoiceData.grandTotal}</span>
                        </div>
                        <template if:true={invoiceData.discountAmount}>
                            <div class="summary-row">
                                <span class="summary-label">Discount Amount:</span>
                                <span class="summary-value">{invoiceData.formattedDiscountAmount}</span>
                            </div>
                        </template>
                        <template if:true={invoiceData.remittanceFormTotalAfterDiscount}>
                            <div class="summary-row">
                                <span class="summary-label">Remittance Form Total (After Discount):</span>
                                <span class="summary-value">{invoiceData.formattedRemittanceFormTotalAfterDiscount}</span>
                            </div>
                        </template>
                    </div>
                    <div class="summary-section summary-amounts">
                        <template if:true={invoiceData.balance}>
                            <div class="summary-row balance-row">
                                <span class="summary-label">Balance:</span>
                                <span class="summary-value">{invoiceData.formattedBalance}</span>
                            </div>
                        </template>
                        <template if:true={invoiceData.paidAmount}>
                            <div class="summary-row paid-row">
                                <span class="summary-label">Paid Amount:</span>
                                <span class="summary-value">{invoiceData.formattedPaidAmount}</span>
                            </div>
                        </template>
                    </div>
                </div>

            </div>
        </template>

        <template if:false={invoiceData}>
            <div class="slds-p-around_medium">
                <p>No invoice data available.</p>
            </div>
        </template>
    </template>

    <!-- Add Invoice Modal -->
    <template if:true={showAddInvoiceModal}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <lightning-button-icon
                        icon-name="utility:close"
                        alternative-text="Close"
                        class="slds-modal__close"
                        onclick={handleCloseAddInvoice}>
                    </lightning-button-icon>
                    <h2 class="slds-modal__title">Add Invoice to Remittance</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <template if:true={isLoadingAvailable}>
                        <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
                    </template>
                    <template if:false={isLoadingAvailable}>
                        <template if:true={availableInvoices.length}>
                            <table class="slds-table slds-table_bordered slds-table_cell-buffer">
                                <thead>
                                    <tr>
                                        <th>Invoice</th>
                                        <th>Application</th>
                                        <th>Customer</th>
                                        <th>Vehicle</th>
                                        <th>Amount</th>
                                        <th></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={availableInvoices} for:item="inv">
                                        <tr key={inv.id}>
                                            <td>{inv.invoiceName}</td>
                                            <td>{inv.applicationNumber}</td>
                                            <td>{inv.customerName}</td>
                                            <td>{inv.vehicleInfo}</td>
                                            <td>{inv.formattedAmount}</td>
                                            <td>
                                                <lightning-button
                                                    variant="brand"
                                                    label="Add"
                                                    data-id={inv.id}
                                                    onclick={handleSelectInvoice}>
                                                </lightning-button>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </template>
                        <template if:false={availableInvoices.length}>
                            <p class="slds-text-align_center slds-p-around_medium">No available invoices found.</p>
                        </template>
                    </template>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={handleCloseAddInvoice}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
