<template>
    <template if:true={isLoading}>
        <div class="loading-container">
            <lightning-spinner alternative-text="Loading invoice..." size="medium"></lightning-spinner>
        </div>
    </template>

    <template if:true={error}>
        <div class="error-container" role="alert">
            <div class="error-icon-row">
                <lightning-icon icon-name="utility:error" variant="error" size="small"></lightning-icon>
                <span class="error-title">Unable to load invoice</span>
            </div>
            <p class="error-message">{error}</p>
        </div>
    </template>

    <template if:true={invoiceData}>
        <div class="invoice-wrapper">

            <!-- ACTION BAR -->
            <div class="action-bar">
                <template if:true={hasApplication}>
                    <lightning-button variant="neutral" label="Back to Application" icon-name="utility:back"
                        onclick={handleBackToApplication}></lightning-button>
                </template>
                <template if:true={canCancelInvoice}>
                    <lightning-button variant="destructive" label="Request Cancellation" icon-name="utility:ban"
                        disabled={isLoading} onclick={handleCancelInvoice}></lightning-button>
                </template>
                <template if:true={canPay}>
                    <lightning-button variant="success" label="Pay Now" icon-name="utility:currency"
                        disabled={isLoading} onclick={handlePayNow}></lightning-button>
                </template>
                <lightning-button variant="brand" label="Download Invoice" icon-name="utility:download"
                    disabled={isLoading} onclick={handleDownloadPDF}></lightning-button>
            </div>

            <template if:true={hasPaymentInitiated}>
                <div class="payment-banner" role="alert">
                    <lightning-icon icon-name="utility:warning" variant="warning" size="x-small"></lightning-icon>
                    <span>A payment has been initiated on this invoice. Package removal and cancellation are locked.</span>
                </div>
            </template>

            <!-- ══════════════ INVOICE DOCUMENT ══════════════ -->
            <div class="invoice-doc">

                <!-- ── HEADER: Logo (left) + INVOICE title block (right) ── -->
                <div class="inv-header">

                    <!-- LEFT: Logo + company identity + address -->
                    <div class="inv-header-left">
                        <div class="brand-block">
                            <img src={aprotectLogoUrl} alt="A-Protect Warranty Corporation" class="brand-logo" />
                        </div>
                        <div class="company-addr">
                            <div>8800 Dufferin St. Suite 302B</div>
                            <div>Concord, Ontario L4K 0C5</div>
                            <div>TF: 1-866-660-6444&nbsp;&nbsp;Tel: 416-661-7444</div>
                            <div>E-mail: info@a-protectwarranty.com</div>
                            <div>HST #: 832142467RT0001</div>
                        </div>
                    </div>

                    <!-- RIGHT: INVOICE title + meta -->
                    <div class="inv-header-right">
                        <div class="inv-title-word">INVOICE</div>
                        <table class="inv-meta-table">
                            <tbody>
                                <tr>
                                    <td class="inv-meta-lbl">INVOICE #</td>
                                    <td class="inv-meta-val inv-num">{invoiceData.invoiceName}</td>
                                </tr>
                                <tr>
                                    <td class="inv-meta-lbl">DATE:</td>
                                    <td class="inv-meta-val">{invoiceData.invoiceDate}</td>
                                </tr>
                                <template if:true={invoiceData.dueDate}>
                                    <tr>
                                        <td class="inv-meta-lbl">DUE DATE:</td>
                                        <td class="inv-meta-val">{invoiceData.dueDate}</td>
                                    </tr>
                                </template>
                                <tr>
                                    <td class="inv-meta-lbl">STATUS:</td>
                                    <td class={invoiceData.statusClass}>{invoiceData.invoiceStatus}</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="inv-divider"></div>

                <!-- ── BILL TO + VEHICLE ── -->
                <div class="bill-vehicle-row">
                    <div class="bill-col">
                        <div class="bv-label">BILL TO</div>
                        <template if:true={invoiceData.dealerName}>
                            <div class="bill-dealer">{invoiceData.dealerName}</div>
                        </template>
                        <template if:true={invoiceData.billTo}>
                            <lightning-formatted-rich-text value={invoiceData.billTo} class="bill-rich"></lightning-formatted-rich-text>
                        </template>
                        <template if:false={invoiceData.dealerName}>
                            <template if:false={invoiceData.billTo}>
                                <div class="bill-empty">—</div>
                            </template>
                        </template>
                    </div>

                    <div class="vehicle-col">
                        <div class="bv-label">VEHICLE</div>
                        <div class="vehicle-grid">
                            <span class="vg-lbl">Application (REF):</span>
                            <span class="vg-val">
                                <a class="app-link" onclick={handleApplicationClick}>{invoiceData.applicationId}</a>
                            </span>
                            <template if:true={invoiceData.customerFullName}>
                                <span class="vg-lbl">Customer:</span>
                                <span class="vg-val vg-customer">{invoiceData.customerFullName}</span>
                            </template>
                            <template if:true={invoiceData.vehicleInfo}>
                                <span class="vg-lbl">Year/Make/Model/Trim:</span>
                                <span class="vg-val">{invoiceData.vehicleInfo}</span>
                            </template>
                            <template if:true={invoiceData.vin}>
                                <span class="vg-lbl">VIN #</span>
                                <span class="vg-val">{invoiceData.vin}</span>
                            </template>
                            <template if:true={invoiceData.formattedOdometer}>
                                <span class="vg-lbl">Odometer:</span>
                                <span class="vg-val">{invoiceData.formattedOdometer}</span>
                            </template>
                        </div>
                    </div>
                </div>

                <!-- ── LINE ITEMS TABLE ── -->
                <table class="li-table">
                    <thead>
                        <tr class="li-head-row">
                            <th class="li-th li-th-desc">ITEM/DESCRIPTION</th>
                            <th class="li-th li-th-term">TERM</th>
                            <th class="li-th li-th-price">PRICE</th>
                            <th class="li-th li-th-sub">SUB-TOTAL</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={invoiceData.packages} for:item="pkg">
                            <!-- Category header -->
                            <tr key={pkg.categoryRowKey} class="li-cat-row">
                                <td colspan="4" class="li-cat-cell">{pkg.recordTypeName}</td>
                            </tr>
                            <!-- Main package row -->
                            <tr key={pkg.packageId} class="li-pkg-row">
                                <td class="li-td li-td-desc">
                                    <div class="pkg-name">{pkg.packageName}</div>
                                    <template if:true={pkg.coverageLabel}>
                                        <div class="pkg-coverage">Coverage: {pkg.coverageLabel}</div>
                                    </template>

                                </td>
                                <td class="li-td li-td-term">{pkg.packageTerm}</td>
                                <td class="li-td li-td-price">{pkg.formattedBaseCostPrice}</td>
                                <td class="li-td li-td-sub">{pkg.formattedLineTotal}</td>
                            </tr>
                            <!-- Add-on rows -->
                            <template for:each={pkg.additionalOptions} for:item="opt">
                                <tr key={opt.optionId} class="li-addon-row">
                                    <td class="li-td li-td-desc li-addon-desc">
                                        {opt.optionName}
                                        <span class="opt-tag">({opt.selectionType})</span>
                                    </td>
                                    <td class="li-td li-td-term">-</td>
                                    <td class="li-td li-td-price">{opt.formattedCostPrice}</td>
                                    <td class="li-td li-td-sub"></td>
                                </tr>
                            </template>
                            <!-- Premium fee row -->
                            <template if:true={pkg.hasPremiumModelFee}>
                                <tr key={pkg.premiumRowKey} class="li-addon-row">
                                    <td class="li-td li-td-desc li-addon-desc">
                                        Premium Vehicle Fee
                                        <span class="opt-tag">(Fee)</span>
                                    </td>
                                    <td class="li-td li-td-term">-</td>
                                    <td class="li-td li-td-price">{pkg.formattedPremiumModelFee}</td>
                                    <td class="li-td li-td-sub"></td>
                                </tr>
                            </template>
                        </template>
                    </tbody>
                </table>

                <!-- ── TOTALS ── -->
                <div class="totals-wrap">
                    <template if:true={invoiceData.formattedSubTotal}>
                        <div class="totals-row">
                            <span class="tot-lbl">SUB-TOTAL:</span>
                            <span class="tot-val">{invoiceData.formattedSubTotal}</span>
                        </div>
                    </template>
                    <template if:true={invoiceData.formattedTaxTotal}>
                        <div class="totals-row">
                            <span class="tot-lbl">HST (ON) {invoiceData.blendedTaxRate}%:</span>
                            <span class="tot-val">{invoiceData.formattedTaxTotal}</span>
                        </div>
                    </template>
                    <div class="totals-row tot-grand">
                        <span class="tot-lbl">TOTAL DUE:</span>
                        <span class="tot-val">{invoiceData.formattedBalance}</span>
                    </div>
                </div>

                <!-- ── BOTTOM ROW: Thank You (left) + Footer note (right) ── -->
                <div class="inv-bottom-row">
                    <div class="thankyou-img-wrap">
                        <img src={thankYouBannerUrl} alt="Thank You for Your Business!" class="thankyou-img" />
                    </div>
                    <div class="inv-footer-note">
                        <p>Please remit payment within 30 days of the invoice date.</p>
                        <p>Any cheque returned or dishonoured by a financial institution will be subject to a $5.00 Administration Fee.</p>
                        <p>Please make all cheques payable to <strong>A-Protect Warranty Corporation</strong>.</p>
                    </div>
                </div>

            </div><!-- /invoice-doc -->
        </div><!-- /invoice-wrapper -->

        <!-- PAY NOW MODAL -->
        <template if:true={showPayModal}>
            <div class="modal-overlay" onclick={handleClosePayModal}>
                <div class="modal-box" onclick={handleModalBoxClick}>
                    <button class="modal-close" onclick={handleClosePayModal} aria-label="Close">&#x2715;</button>
                    <h2 class="modal-title">Pay Invoice</h2>
                    <p class="modal-msg">Are you sure you want to pay for Invoice # <strong>{invoiceData.invoiceName}</strong>? A remittance form will be created.</p>
                    <div class="modal-footer">
                        <button class="modal-btn" disabled={isPayLoading} onclick={handleConfirmPay}>
                            <template if:true={isPayLoading}>Processing...</template>
                            <template if:false={isPayLoading}>Continue to Pay</template>
                        </button>
                    </div>
                </div>
            </div>
        </template>

        <!-- CANCEL MODAL -->
        <template if:true={showCancelModal}>
            <div class="modal-overlay" onclick={handleCloseCancelModal}>
                <div class="modal-box modal-box-lg" onclick={handleModalBoxClick}>
                    <button class="modal-close" onclick={handleCloseCancelModal} aria-label="Close">&#x2715;</button>
                    <h2 class="modal-title">{cancelContext.displayTitle}</h2>
                    <p class="modal-msg">
                        <strong>{cancelContext.displayName}</strong><br/>
                        Current Status: <span class={cancelContext.statusClass}>{cancelContext.currentStatus}</span>
                    </p>
                    <div class="cancel-reason-wrap">
                        <label class="cancel-lbl">Reason <span class="cancel-req">*</span></label>
                        <textarea class="cancel-input" onchange={handleCancelReasonChange}
                            placeholder="Please provide a reason for cancellation..."></textarea>
                    </div>
                    <div class="modal-footer">
                        <button class="modal-btn modal-btn-danger" disabled={cancelSubmitDisabled} onclick={handleConfirmCancellation}>
                            <template if:true={isCancelLoading}>Processing...</template>
                            <template if:false={isCancelLoading}>Submit Cancellation Request</template>
                        </button>
                    </div>
                </div>
            </div>
        </template>

    </template>

    <template if:false={hasContent}>
        <div class="no-data">No invoice data available.</div>
    </template>
</template>
