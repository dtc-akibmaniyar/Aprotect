<template>
    <div class="gap-container">
        <!-- Top Navigation Buttons -->
        <div class="top-navigation-buttons">
            <button
                type="button"
                class="nav-button back-button"
                onclick={handleBack}
                aria-label="Back">
                <span class="button-label">Back</span>
            </button>
        </div>

        <!-- Trisura Logo & Portal Redirect Card -->
        <div class="trisura-logo-card">
            <img src={trisuraLogoUrl} alt="Trisura" class="trisura-logo" />
            <p class="portal-redirect-text">Click below to be redirected to the Trisura Portal</p>
            <a href={portalUrl} target="_blank" rel="noopener noreferrer" class="portal-button">
                <span>Visit Trisura Portal</span>
                <span class="portal-button-arrow">→</span>
            </a>
        </div>

        <!-- Program Information Card -->
        <div class="program-info-card">
            <div class="program-info-header">
                <span class="program-info-header-icon">📋</span>
                <span class="program-info-title">Program Information</span>
            </div>
            <div class="program-info-body">
                <template for:each={formattedContentLines} for:item="line">
                    <template if:true={line.isEmpty}>
                        <div key={line.key} class="content-spacer"></div>
                    </template>
                    <template if:false={line.isEmpty}>
                        <template if:true={line.isHeader}>
                            <p key={line.key} class="content-header">{line.text}</p>
                        </template>
                        <template if:false={line.isHeader}>
                            <template if:true={line.isBullet}>
                                <p key={line.key} class="content-bullet">{line.text}</p>
                            </template>
                            <template if:false={line.isBullet}>
                                <p key={line.key} class="content-paragraph">{line.text}</p>
                            </template>
                        </template>
                    </template>
                </template>
            </div>
        </div>

        <!-- Navigation Buttons -->
        <template if:false={isQuoteStatus}>
            <div class="navigation-buttons">
                <button
                    type="button"
                    class="nav-button save-quote-button"
                    onclick={handleSaveAsQuote}
                    aria-label="Save As Quote">
                    <span class="button-label">Save As Quote</span>
                </button>
                <div class="continue-button-wrapper">
                    <button
                        type="button"
                        class="continue-button"
                        onclick={handleContinue}
                        aria-label="Continue">
                        <span class="continue-label">Continue</span>
                    </button>
                </div>
            </div>
        </template>

        <template if:true={isQuoteStatus}>
            <div class="navigation-buttons">
                <button
                    type="button"
                    class="nav-button save-quote-button"
                    onclick={handleSaveAsQuote}
                    aria-label="Save As Quote">
                    <span class="button-label">Save As Quote</span>
                </button>
                <div class="continue-button-wrapper">
                    <button
                        type="button"
                        class="continue-button"
                        onclick={handleContinue}
                        aria-label="Save &amp; Continue">
                        <span class="continue-label">Save &amp; Continue</span>
                    </button>
                </div>
            </div>
        </template>
    </div>
</template>
