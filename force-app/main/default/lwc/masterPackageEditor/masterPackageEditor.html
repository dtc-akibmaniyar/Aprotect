<template><template lwc:if={editorOpen}><section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open"><div class="slds-modal__container ap-modal"><header class="slds-modal__header"><h2 class="slds-text-heading_medium">{editorTitle}</h2><p class="ap-modal-sub">{editorSubtitle}</p></header><div class="slds-modal__content slds-p-around_medium"><template for:each={editorFields} for:item="f"><div class="ap-form-row" key={f.name}><label class="ap-form-label">{f.label}</label><template lwc:if={f.isSelect}><select class="ap-input" data-field={f.name} value={f.value} onchange={handleFieldChange}><template lwc:if={f.required}><option value="">— select —</option></template><template for:each={f.options} for:item="o"><option key={o.value} value={o.value}>{o.label}</option></template></select></template><template lwc:elif={f.isCheckbox}><input type="checkbox" data-field={f.name} checked={f.value} onchange={handleFieldChange}/></template><template lwc:elif={f.isTextarea}><textarea class="ap-input" rows="2" data-field={f.name} value={f.value} onchange={handleFieldChange}></textarea></template><template lwc:else><input class="ap-input" type={f.type} step="any" data-field={f.name} value={f.value} onchange={handleFieldChange}/></template></div></template><template lwc:if={editorError}><div class="ap-form-error" role="alert">{editorError}</div></template></div><footer class="slds-modal__footer ap-modal-footer"><button class="ap-btn" type="button" onclick={handleEditorClose} disabled={saving}>Cancel</button><button class="ap-btn ap-btn_primary" type="button" onclick={handleEditorSave} disabled={saving}>Save</button></footer></div></section><div class="slds-backdrop slds-backdrop_open"></div></template><template lwc:if={confirmOpen}><section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open"><div class="slds-modal__container ap-modal ap-modal_sm"><header class="slds-modal__header"><h2 class="slds-text-heading_medium">{confirmTitle}</h2></header><div class="slds-modal__content slds-p-around_medium"><p class="ap-confirm-msg">{confirmMessage}</p></div><footer class="slds-modal__footer ap-modal-footer"><button class="ap-btn" type="button" onclick={handleConfirmCancel}>Cancel</button><button class="ap-btn ap-btn_primary" type="button" onclick={handleConfirmOk}>{confirmLabel}</button></footer></div></section><div class="slds-backdrop slds-backdrop_open"></div></template></template>
