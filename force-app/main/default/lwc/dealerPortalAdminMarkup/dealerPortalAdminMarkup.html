<template>
    <div class="markup-container">
        <!-- Header Section -->
        <div class="page-header">
            <div class="header-content">
                <h1 class="page-title">
                    <lightning-icon icon-name="utility:settings" size="medium" class="title-icon"></lightning-icon>
                    Markup Management
                </h1>
                <p class="page-subtitle">Configure pricing and markup for warranty packages</p>
            </div>
        </div>

        <!-- Bulk Update Section -->
        <div class="bulk-update-section">
            <div class="section-card">
                <div class="card-header">
                    <h3 class="card-title">Bulk Update</h3>
                    <p class="card-description">Apply the same markup to all terms</p>
                </div>
                <div class="card-content">
                    <div class="bulk-form">
                        <div class="form-group">
                            <label class="form-label">Default Markup</label>
                            <div class="markup-input-row">
                                <select 
                                    name="default-markup-type"
                                    onchange={handleDefaultMarkupTypeChange}
                                    class="markup-type-select"
                                    data-default-value={defaultMarkupType}>
                                    <option value="">None</option>
                                    <option value="$">$</option>
                                    <option value="%">%</option>
                                </select>
                                <lightning-input 
                                    type="number" 
                                    name="default-markup"
                                    value={defaultMarkup}
                                    onchange={handleDefaultMarkupChange}
                                    class="form-input markup-value"
                                    placeholder="0.00">
                                </lightning-input>
                            </div>
                        </div>
                        <lightning-button 
                            label="Apply to All Terms" 
                            variant="brand" 
                            onclick={applyDefaultMarkup}
                            class="bulk-button">
                        </lightning-button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Packages Section -->
        <div class="packages-section">
            <!-- Loading State -->
            <template if:true={isLoading}>
                <div class="loading-container">
                    <lightning-spinner alternative-text="Loading packages..." size="medium"></lightning-spinner>
                    <p class="loading-text">Loading packages...</p>
                </div>
            </template>
            
            <!-- Error State -->
            <template if:true={error}>
                <div class="error-container">
                    <lightning-icon icon-name="utility:error" size="medium" class="error-icon"></lightning-icon>
                    <h3 class="error-title">Error loading packages</h3>
                    <p class="error-message">{error}</p>
                </div>
            </template>
            
            <!-- Record Type Sections -->
            <template if:false={isLoading}>
                <template for:each={packagesByRecordType} for:item="recordTypeGroup">
                    <div key={recordTypeGroup.recordType} class="record-type-section">
                        <div class="record-type-header">
                            <h2 class="record-type-title">{recordTypeGroup.recordType}</h2>
                            <span class="record-type-count">{recordTypeGroup.packages.length} Package(s)</span>
                        </div>
                        
                        <div class="record-type-content">
                            <template for:each={recordTypeGroup.packages} for:item="pkg">
                                <div key={pkg.Id} class="accordion-item">
                                    <div class="accordion-header" onclick={togglePackage} data-package-id={pkg.Id}>
                                        <div class="accordion-title">
                                            <h3 class="package-name">{pkg.PackageName}</h3>
                                            <span class="package-count">{pkg.terms.length} Terms</span>
                                        </div>
                                        <div class="accordion-toggle">
                                            <lightning-icon icon-name={pkg.toggleIcon} size="small"></lightning-icon>
                                        </div>
                                    </div>
                                    
                                    <div if:true={pkg.isVisible} class="accordion-content">
                                        <!-- Package Level Update Section -->
                                        <div class="package-update-section">
                                            <div class="package-update-header">
                                                <h4 class="package-update-title">Update All Terms in {pkg.PackageName}</h4>
                                            </div>
                                            <div class="package-update-form">
                                                <div class="form-group">
                                                    <label class="form-label">Package Markup</label>
                                                    <div class="markup-input-row">
                                                        <select 
                                                            name="package-markup-type"
                                                            data-package-id={pkg.Id}
                                                            onchange={handlePackageMarkupTypeChange}
                                                            class="markup-type-select"
                                                            data-package-value={pkg.packageMarkupType}>
                                                            <option value="">None</option>
                                                            <option value="$">$</option>
                                                            <option value="%">%</option>
                                                        </select>
                                                        <div class="markup-input-container">
                                                            <template if:true={pkg.packageMarkupType}>
                                                                <span class="currency-prefix">{pkg.packageMarkupType}</span>
                                                            </template>
                                                            <input 
                                                                type="number" 
                                                                data-package-id={pkg.Id}
                                                                value={pkg.packageMarkup}
                                                                onchange={handlePackageMarkupChange}
                                                                onkeydown={handleMarkupKeydown}
                                                                class="markup-input"
                                                                placeholder="0.00"
                                                                step="0.01"
                                                                min="0">
                                                        </div>
                                                    </div>
                                                </div>
                                                <lightning-button 
                                                    variant="brand" 
                                                    label="Update All Terms"
                                                    data-package-id={pkg.Id}
                                                    onclick={updatePackageMarkup}
                                                    class="package-update-button">
                                                </lightning-button>
                                            </div>
                                        </div>
                                        
                                        <template for:each={pkg.terms} for:item="term">
                                            <div key={term.Id} class="term-item">
                                                <div class="term-info">
                                                    <div class="term-header">
                                                        <h4 class="term-name">{term.termName}</h4>
                                                    </div>
                                                    
                                                    <div class="pricing-row">
                                                        <div class="price-group">
                                                            <label class="price-label">Base Cost</label>
                                                            <div class="price-value">${term.netCost}</div>
                                                        </div>
                                                        
                                                        <div class="price-group">
                                                            <label class="price-label">Markup</label>
                                                            <div class="markup-input-row">
                                                                <select 
                                                                    name="markup-type"
                                                                    data-term-id={term.Id}
                                                                    onchange={handleMarkupTypeChange}
                                                                    class="markup-type-select"
                                                                    data-term-value={term.markupType}>
                                                                    <option value="">None</option>
                                                                    <option value="$">$</option>
                                                                    <option value="%">%</option>
                                                                </select>
                                                                <div class="markup-input-container">
                                                                    <template if:true={term.markupType}>
                                                                        <span class="currency-prefix">{term.markupType}</span>
                                                                    </template>
                                                                    <input 
                                                                        type="number" 
                                                                        data-term-id={term.Id}
                                                                        value={term.markup}
                                                                        onchange={handleMarkupChange}
                                                                        onkeydown={handleMarkupKeydown}
                                                                        class="markup-input"
                                                                        placeholder="0.00"
                                                                        step="0.01"
                                                                        min="0">
                                                                </div>
                                                            </div>
                                                        </div>
                                                        
                                                        <div class="price-group">
                                                            <label class="price-label">Total Price</label>
                                                            <div class="price-value total">${term.totalPrice}</div>
                                                        </div>
                                                        
                                                        <div class="action-group">
                                                            <lightning-button 
                                                                variant="brand" 
                                                                label="Update"
                                                                data-term-id={term.Id}
                                                                onclick={updateMarkup}
                                                                class="update-button">
                                                            </lightning-button>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>
            </template>
        </div>
    </div>
</template>
