        <!-- Columns -->
        <div class="dp-columns">
            <div class="col date">DATE</div>
            <div class="col id">Quote ID #</div>
            <div class="col vehicle">VEHICLE INFO</div>
            <div class="col services">SERVICES</div>
            <div class="col actions"></div>
            <div class="col status"></div>
        </div>

        <!-- Rows -->
        <template if:true={isLoading}>
            <div class="dp-row dp-row-loading">
                <div class="dp-spinner"></div>
                <span>Loading quotes…</span>
            </div>
        </template>
        <template if:false={isLoading}>

                <div key={app.id} class="dp-row">
                    <div class="cell date">{app.date}</div>
                    <div class="cell id">
                        <a class="record-link" data-id={app.id} onclick={handleOpenRecord}>{app.appNumber}</a>
                    </div>
                    <div class="cell vehicle">
                        <div class="v-name">{app.vehicle.name}</div>
                        <div class="v-sub">VIN# {app.vehicle.vin}</div>
                        <div class="v-sub">Purchase Price ${app.vehicle.price}</div>
                        <div class="v-sub">Odometer {app.vehicle.odometer} {app.vehicle.odometerUnit}</div>
                    </div>
                    <div class="cell services">
                        <template for:each={app.services} for:item="svc">

        <!-- Pagination controls -->
        <div class="dp-pagination">
            <div class="dp-page-left">
                <span>Rows per page:</span>
                <select class="dp-page-size" value={pageSize} onchange={handlePageSizeChange}>
                    <option value="10">10</option>
                    <option value="20">20</option>
                    <option value="50">50</option>
                </select>
                <span class="dp-count">Total Quotes: {filtered.length}</span>
            </div>
            <div class="dp-page-right">
                <button class="dp-page-btn" onclick={handlePagePrev} disabled={isFirstPage}>Prev</button>
                <span class="dp-page-indicator">Page {page} of {totalPages}</span>
                <button class="dp-page-btn" onclick={handlePageNext} disabled={isLastPage}>Next</button>
            </div>
        </div>

        <!-- New Quote Modal -->
        <template if:true={showNewQuoteModal}>
            <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-new-quote" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container Create-New-modal">
                    <button class="modal-close-btn" onclick={handleCloseNewQuoteModal} aria-label="Close">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M18 6L6 18M6 6L18 18" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                    <div class="slds-p-left_medium slds-p-right_medium slds-p-top_medium">
                        <h2 id="modal-heading-new-quote" class="modal-title">Create New Quote</h2>
                    </div>
                    <div class="slds-p-left_medium slds-p-right_medium">
                        <p class="cancellation-message">
                            Would you like to create a new quote?
                        </p>
                    </div>
                    <div class="slds-p-left_medium slds-p-right_medium slds-p-top_medium">
                        <button class="modal-btn-continue slds-p-around_x-small" onclick={handleContinueToCreateQuote}>Continue to Create New Quote</button>
                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open" onclick={handleCloseNewQuoteModal}></div>
        </template>

        <!-- Cancellation Request Modal -->
        <template if:true={showCancellationModal}>
            <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container cancellation-modal">
                    <button class="modal-close-btn" onclick={handleCloseCancellationModal} aria-label="Close">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M18 6L6 18M6 6L18 18" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                    <div class="slds-p-left_medium slds-p-right_medium slds-p-top_medium">
                        <h2 id="modal-heading-01" class="modal-title">Request Cancellation</h2>
                    </div>
                    <div class="slds-p-left_medium slds-p-right_medium">
                        <p class="cancellation-message">
                            Would you like to cancel the quote for <span class="vehicle-name">{cancellationVehicleName}</span><br/>
                            VIN#<span class="vin-number"> {cancellationVIN}</span>?
                        </p>
                    </div>
                    <div class="slds-p-left_medium slds-p-right_medium slds-p-top_medium">
                        <button class="modal-btn-continue slds-p-around_x-small" onclick={handleContinueToCancellation}>Continue to Cancellation</button>
                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open" onclick={handleCloseCancellationModal}></div>
        </template>
    </div>
</template>
