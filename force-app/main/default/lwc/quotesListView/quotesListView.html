<template>
    <div class="dp-container">
        <!-- Header -->
        <div class="dp-header">
            <div class="dp-header-left">
                <div class="dp-app-icon" aria-hidden="true">
                    <!-- Placeholder SVG -->
                    <svg width="29" height="38" viewBox="0 0 29 38" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <g clip-path="url(#clip0_34_2151)">
                            <path d="M26.9337 0H1.41647C0.645743 0 0 0.842427 0 1.84791V35.4363C0 36.4418 0.645743 37.2842 1.41647 37.2842H19.5181L28.3502 25.4902V1.84791C28.3502 0.842427 27.7045 0 26.9337 0ZM6.62407 9.18518C6.62407 9.02213 6.76989 8.85908 6.95736 8.85908H21.2262C21.4137 8.85908 21.5595 8.99495 21.5595 9.18518V12.3647C21.5595 12.5277 21.4137 12.6908 21.2262 12.6908H6.97819C6.79072 12.6908 6.64491 12.5549 6.64491 12.3647V9.18518H6.62407ZM6.62407 15.8702C6.62407 15.7072 6.76989 15.5441 6.95736 15.5441H21.2262C21.4137 15.5441 21.5595 15.68 21.5595 15.8702V19.0497C21.5595 19.2128 21.4137 19.3758 21.2262 19.3758H6.97819C6.79072 19.3758 6.64491 19.24 6.64491 19.0497V15.8702H6.62407ZM16.9351 25.4359C16.9351 25.5989 16.831 25.762 16.706 25.762H6.87404C6.74906 25.762 6.64491 25.6261 6.64491 25.4359V22.2564C6.64491 22.0933 6.74906 21.9303 6.87404 21.9303H16.706C16.831 21.9303 16.9351 22.0662 16.9351 22.2564V25.4359ZM19.4348 34.1863V25.1913H26.3297L19.4348 34.1863Z" fill="#5184B7" />
                        </g>
                        <defs>
                            <clipPath id="clip0_34_2151">
                                <rect width="28.3502" height="37.2842" fill="white" />
                            </clipPath>
                        </defs>
                    </svg>

                </div>
                <h2 class="dp-title">Quotes</h2>
            </div>
            <div class="dp-header-right">
                <button class="dp-new-btn" onclick={handleCreateNewQuote} aria-label="Create New Quote" disabled={isCreating}>
                    <span class="dp-new-icon" aria-hidden="true">
                        <svg width="39" height="39" viewBox="0 0 49 54" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <g clip-path="url(#clip0_34_1268)">
                                <path d="M6.94684 40.0994V36.4186H19.4346C19.6827 35.1195 20.0962 33.907 20.5924 32.7378H6.94684V29.0569H22.8253C23.9418 27.6712 25.265 26.4587 26.7536 25.506H6.94684V21.8252H31.5089V23.514C32.6253 23.2542 33.7831 23.1243 34.9409 23.1243C36.0987 23.1243 37.3806 23.2975 38.5384 23.5573V2.03528C38.5384 0.909382 37.67 0 36.5949 0H11.9916L0 12.8613V48.7602C0 49.8861 0.868354 50.7955 1.94346 50.7955H23.2802C20.7992 47.9374 19.2692 44.2133 19.1451 40.0994H6.94684ZM21.0886 14.3769H31.5089V18.0577H21.0886V14.3769ZM13.4388 4.33039V13.0345H5.16878L13.4388 4.33039Z" fill="#5184B8"/>
                                <path d="M45.1131 30.2263C39.9029 24.77 31.4675 24.77 26.2987 30.2263C21.0886 35.6825 21.0886 44.5166 26.2987 49.9295C31.5088 55.3858 39.9443 55.3858 45.1131 49.9295C50.3232 44.4732 50.3232 35.6392 45.1131 30.2263ZM42.5493 40.8357C42.5493 41.1821 42.2599 41.4853 41.9291 41.4853H37.1325V46.6384C37.1325 46.9849 36.843 47.288 36.5122 47.288H34.8168C34.8168 47.288 34.486 47.2014 34.4033 47.1148C34.3206 47.0282 34.2379 46.855 34.2379 46.6817V41.5286H29.4413C29.4413 41.5286 29.1105 41.442 29.0278 41.3554C28.9038 41.2255 28.8624 41.0955 28.8624 40.9223V39.4067C28.8624 39.4067 28.9451 39.0603 29.0278 38.9736C29.1105 38.887 29.2759 38.8004 29.4413 38.8004H34.2379V33.6473C34.2379 33.3008 34.5274 32.9977 34.8582 32.9977H36.5536C36.5536 32.9977 36.8844 33.0843 36.9671 33.1709C37.0911 33.3008 37.1325 33.4307 37.1325 33.604V38.7571H41.9291C42.2599 38.7571 42.5493 39.0603 42.5493 39.4067V40.8357Z" fill="#80C52C"/>
                            </g>
                            <defs>
                                <clipPath id="clip0_34_1268">
                                    <rect width="49" height="54" fill="white"/>
                                </clipPath>
                            </defs>
                        </svg>
                    </span>
                    <span class="dp-new-text">
                        <span class="dp-new-top">CREATE</span>
                        <span class="dp-new-bottom">NEW QUOTE</span>
                    </span>
                </button>
                <div class="dp-search">
                    <span class="dp-search-icon" aria-hidden="true">
                        <svg width="40" height="32" viewBox="0 0 40 32" fill="none" xmlns="http://www.w3.org/2000/svg">
<g clip-path="url(#clip0_263_117)">
<path d="M11 22V20H29V22H11ZM11 17V15H29V17H11ZM11 12V10H29V12H11Z" fill="#49454F"/>
</g>
<defs>
<clipPath id="clip0_263_117">
<rect y="-4" width="40" height="40" rx="20" fill="white"/>
</clipPath>
</defs>
</svg>

                    </span>
                    <input class="dp-search-input" placeholder="Search by Customer Name, Quote ID, or VIN" value={search} oninput={handleSearchChange} />
                    <span class="dp-filter-icon" aria-hidden="true" title="Filters">
                        <svg width="48" height="32" viewBox="0 0 48 32" fill="none" xmlns="http://www.w3.org/2000/svg">
<g clip-path="url(#clip0_263_123)">
<path d="M31.6 25L25.3 18.7C24.8 19.1 24.225 19.4167 23.575 19.65C22.925 19.8833 22.2333 20 21.5 20C19.6833 20 18.1458 19.3708 16.8875 18.1125C15.6292 16.8542 15 15.3167 15 13.5C15 11.6833 15.6292 10.1458 16.8875 8.8875C18.1458 7.62917 19.6833 7 21.5 7C23.3167 7 24.8542 7.62917 26.1125 8.8875C27.3708 10.1458 28 11.6833 28 13.5C28 14.2333 27.8833 14.925 27.65 15.575C27.4167 16.225 27.1 16.8 26.7 17.3L33 23.6L31.6 25ZM21.5 18C22.75 18 23.8125 17.5625 24.6875 16.6875C25.5625 15.8125 26 14.75 26 13.5C26 12.25 25.5625 11.1875 24.6875 10.3125C23.8125 9.4375 22.75 9 21.5 9C20.25 9 19.1875 9.4375 18.3125 10.3125C17.4375 11.1875 17 12.25 17 13.5C17 14.75 17.4375 15.8125 18.3125 16.6875C19.1875 17.5625 20.25 18 21.5 18Z" fill="#49454F"/>
</g>
<defs>
<clipPath id="clip0_263_123">
<rect x="4" y="-4" width="40" height="40" rx="20" fill="white"/>
</clipPath>
</defs>
</svg>

                    </span>
                </div>
            </div>
        </div>

        <!-- Columns -->
        <div class="dp-columns">
            <div class="col date">DATE</div>
            <div class="col id">Quote ID #</div>
            <div class="col vehicle">VEHICLE INFO</div>
            <div class="col services">SERVICES</div>
            <div class="col actions"></div>
            <div class="col status"></div>
        </div>

        <!-- Rows -->
        <template if:true={isLoading}>
            <div class="dp-row dp-row-loading">
                <div class="dp-spinner"></div>
                <span>Loading quotes…</span>
            </div>
        </template>
        <template if:false={isLoading}>
            <template for:each={paged} for:item="app">
                <div key={app.id} class="dp-row">
                    <div class="cell date">{app.date}</div>
                    <div class="cell id">
                        <a class="record-link" data-id={app.id} onclick={handleOpenRecord}>{app.appNumber}</a>
                    </div>
                    <div class="cell vehicle">
                        <div class="v-name">{app.vehicle.name}</div>
                        <div class="v-sub">VIN# {app.vehicle.vin}</div>
                        <div class="v-sub">Purchase Price ${app.vehicle.price}</div>
                        <div class="v-sub">Odometer {app.vehicle.odometer} {app.vehicle.odometerUnit}</div>
                    </div>
                    <div class="cell services">
                        <template for:each={app.services} for:item="svc">
                            <span key={svc.label} class="chip">{svc.label}</span>
                        </template>
                    </div>
                    <div class="cell actions">
                        <div>
                            <!-- Generate PDF Button -->
                            <button class="icon-btn pdf-btn" title="Generate PDF" onclick={clickGeneratePDF} aria-label="Generate PDF">
                                <svg width="25" height="25" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M14 2H6C5.46957 2 4.96086 2.21071 4.58579 2.58579C4.21071 2.96086 4 3.46957 4 4V20C4 20.5304 4.21071 21.0391 4.58579 21.4142C4.96086 21.7893 5.46957 22 6 22H18C18.5304 22 19.0391 21.7893 19.4142 21.4142C19.7893 21.0391 20 20.5304 20 20V8L14 2Z" stroke="#E74C3C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="#FFF5F5"/>
                                    <path d="M14 2V8H20" stroke="#E74C3C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                    <text x="12" y="17" text-anchor="middle" font-size="6" font-weight="bold" fill="#E74C3C" font-family="Arial">PDF</text>
                                </svg>
                            </button>

                            <!-- Preview PDF Button (only when files exist) -->
                            <template if:true={app.hasFiles}>
                                <button class="icon-btn pdf-btn" title="Preview PDF" onclick={clickViewPDF} aria-label="Preview PDF">
                                    <svg width="25" height="25" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                        <path d="M14 2H6C5.46957 2 4.96086 2.21071 4.58579 2.58579C4.21071 2.96086 4 3.46957 4 4V20C4 20.5304 4.21071 21.0391 4.58579 21.4142C4.96086 21.7893 5.46957 22 6 22H18C18.5304 22 19.0391 21.7893 19.4142 21.4142C19.7893 21.0391 20 20.5304 20 20V8L14 2Z" stroke="#3498DB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="#F0F8FF"/>
                                        <path d="M14 2V8H20" stroke="#3498DB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                        <path d="M8 13C8 13 9.5 11 12 11C14.5 11 16 13 16 13C16 13 14.5 15 12 15C9.5 15 8 13 8 13Z" stroke="#3498DB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                                        <circle cx="12" cy="13" r="1" fill="#3498DB"/>
                                    </svg>
                                </button>
                            </template>

                            <!-- Convert to Application Button -->
                            <button class="icon-btn convert" title="Convert to Application" onclick={clickConvert} aria-label="Convert to Application">
                                <svg width="25" height="25" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M17 1L21 5L17 9" stroke="#5184B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                    <path d="M3 11V9C3 7.93913 3.42143 6.92172 4.17157 6.17157C4.92172 5.42143 5.93913 5 7 5H21" stroke="#5184B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                    <path d="M7 23L3 19L7 15" stroke="#5184B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                    <path d="M21 13V15C21 16.0609 20.5786 17.0783 19.8284 17.8284C19.0783 18.5786 18.0609 19 17 19H3" stroke="#5184B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </button>




                        </div>
                    </div>
                </div>
            </template>
        </template>

        <!-- Pagination controls -->
        <div class="dp-pagination">
            <div class="dp-page-left">
                <span>Rows per page:</span>
                <select class="dp-page-size" value={pageSize} onchange={handlePageSizeChange}>
                    <option value="10">10</option>
                    <option value="20">20</option>
                    <option value="50">50</option>
                </select>
                <span class="dp-count">Total Quotes: {filtered.length}</span>
            </div>
            <div class="dp-page-right">
                <button class="dp-page-btn" onclick={handlePagePrev} disabled={isFirstPage}>Prev</button>
                <span class="dp-page-indicator">Page {page} of {totalPages}</span>
                <button class="dp-page-btn" onclick={handlePageNext} disabled={isLastPage}>Next</button>
            </div>
        </div>

        <!-- New Quote Modal -->
        <template if:true={showNewQuoteModal}>
            <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-new-quote" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container Create-New-modal">
                    <button class="modal-close-btn" onclick={handleCloseNewQuoteModal} aria-label="Close">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M18 6L6 18M6 6L18 18" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                    <div class="slds-p-left_medium slds-p-right_medium slds-p-top_medium">
                        <h2 id="modal-heading-new-quote" class="modal-title">Create New Quote</h2>
                    </div>
                    <div class="slds-p-left_medium slds-p-right_medium">
                        <p class="cancellation-message">
                            Would you like to create a new quote?
                        </p>
                    </div>
                    <div class="slds-p-left_medium slds-p-right_medium slds-p-top_medium">
                        <button class="modal-btn-continue slds-p-around_x-small" onclick={handleContinueToCreateQuote}>Continue to Create New Quote</button>
                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open" onclick={handleCloseNewQuoteModal}></div>
        </template>



        <!-- Convert to Application Modal -->
        <template if:true={showConvertModal}>
            <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-convert" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container cancellation-modal">
                    <button class="modal-close-btn" onclick={handleCloseConvertModal} aria-label="Close">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M18 6L6 18M6 6L18 18" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                    <div class="slds-p-left_medium slds-p-right_medium slds-p-top_medium">
                        <h2 id="modal-heading-convert" class="modal-title">Convert to Application</h2>
                    </div>
                    <div class="slds-p-left_medium slds-p-right_medium">
                        <p class="cancellation-message">
                            Would you like to convert the quote for <span class="vehicle-name">{convertVehicleName}</span><br/>
                            VIN#<span class="vin-number"> {convertVIN}</span> to an application?<br/><br/>
                            All quote details will be preserved.
                        </p>
                    </div>
                    <div class="slds-p-left_medium slds-p-right_medium slds-p-top_medium">
                        <button class="modal-btn-continue slds-p-around_x-small" onclick={handleContinueToConvert} disabled={isConverting}>
                            <template if:true={isConverting}>Converting…</template>
                            <template if:false={isConverting}>Convert to Application</template>
                        </button>
                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open" onclick={handleCloseConvertModal}></div>
        </template>
    </div>
</template>
