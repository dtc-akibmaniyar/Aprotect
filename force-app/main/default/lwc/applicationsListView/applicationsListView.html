        <div class="dp-columns">
            <div class="col date">DATE</div>
            <div class="col id">APPLICATION ID #</div>
            <div class="col customer">CUSTOMER</div>
            <div class="col vehicle">VEHICLE INFO</div>
            <div class="col services">SERVICES</div>
            <div class="col actions"></div>
            <div class="col status"></div>
        </div>

        <!-- Rows -->
        <template if:true={isLoading}>
            <div class="dp-row dp-row-loading">
                <div class="dp-spinner"></div>
                <span>Loading applications…</span>
            </div>
        </template>

            <template for:each={applications} for:item="app">
                <div key={app.id} class="dp-row">
                    <div class="cell date">{app.date}</div>
                    <div class="cell id">
                        <a class="record-link" data-id={app.id} onclick={handleOpenRecord}>{app.appNumber}</a>
                    </div>
                    <div class="cell customer">
                        <div class="c-name">{app.customer.name}</div>
                        <div class="c-sub">{app.customer.address1}</div>
                        <div class="c-sub">{app.customer.address2}</div>
                        <div class="c-sub">{app.customer.phone}</div>
                        <div class="c-sub">{app.customer.email}</div>
                    </div>
                    <div class="cell vehicle">
                        <div class="v-name">{app.vehicle.name}</div>
                        <div class="v-sub">VIN# {app.vehicle.vin}</div>
                        <div class="v-sub">Purchase Price ${app.vehicle.price}</div>
                        <div class="v-sub">Odometer {app.vehicle.odometer} {app.vehicle.odometerUnit}</div>
                    </div>
                    <div class="cell services">
                        <template for:each={app.services} for:item="svc">
                            <div key={svc.label} class="service-item">
                                <span class="chip">{svc.label}</span>
                                <div class="service-prices">
                                    <template if:true={svc.costPriceWithoutTax}>
                                        <div class="price-row">
                                            <span class="service-price-label">Cost Price (Ex Tax):</span>
                                            <span class="service-price">{svc.costPriceWithoutTax}</span>
                                        </div>
                                    </template>
                                    <template if:true={svc.costPriceWithTax}>
                                        <div class="price-row">
                                            <span class="service-price-label">Cost Price (Inc Tax):</span>
                                            <span class="service-price">{svc.costPriceWithTax}</span>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </template>

        <!-- Pagination controls -->
        <div class="dp-pagination">
            <div class="dp-page-left">
                <span>Rows per page:</span>
                <select class="dp-page-size" value={pageSize} onchange={handlePageSizeChange}>
                    <option value="10">10</option>
                    <option value="20">20</option>
                    <option value="50">50</option>
                </select>
                <span class="dp-count">Total Applications Sold: {filtered.length}</span>
            </div>
            <div class="dp-page-right">
                <button class="dp-page-btn" onclick={handlePagePrev} disabled={isFirstPage}>Prev</button>
                <span class="dp-page-indicator">Page {page} of {totalPages}</span>
                <button class="dp-page-btn" onclick={handlePageNext} disabled={isLastPage}>Next</button>
            </div>
        </div>

        <!-- Cancellation Request Modal — uses cancellationModal LWC flow -->
        <template if:true={showCancellationModal}>
            <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="cancel-modal-heading" class="slds-modal slds-fade-in-open slds-modal_large">
                <div class="slds-modal__container">
                    <div class="slds-modal__content slds-p-around_none" style="overflow: visible;">
                        <c-cancellation-modal
                            record-id={cancellationApplicationId}
                            onclose={handleCloseCancellationModal}>
                        </c-cancellation-modal>
                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open" onclick={handleCloseCancellationModal}></div>
        </template>

        <!-- New Application Modal -->
        <template if:true={showNewApplicationModal}>
            <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-02" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container Create-New-modal">
                    <button class="modal-close-btn" onclick={handleCloseNewApplicationModal} aria-label="Close">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M18 6L6 18M6 6L18 18" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                    <div class="slds-p-left_medium slds-p-right_medium slds-p-top_medium">
                        <h2 id="modal-heading-02" class="modal-title">Create New Application</h2>
                    </div>
                    <div class="slds-p-left_medium slds-p-right_medium">
                        <p class="cancellation-message">
                            Would you like to create a new application?
                        </p>
                    </div>
                    <div class="slds-p-left_medium slds-p-right_medium slds-p-top_medium">
                        <button class="modal-btn-continue slds-p-around_x-small" onclick={handleContinueToCreateApplication}>Continue to Create new Application</button>
                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open" onclick={handleCloseNewApplicationModal}></div>
        </template>

        <!-- Make Payment Modal -->
        <template if:true={showMakePaymentModal}>
            <c-dealer-make-payment-modal
                unpaid-applications={unpaidApplications}
                is-loading={isLoadingApplications}
                onclose={handleCloseMakePaymentModal}
                oncreateremittance={handleCreateRemittanceFromModal}>
            </c-dealer-make-payment-modal>
        </template>
    </div>
</template>
