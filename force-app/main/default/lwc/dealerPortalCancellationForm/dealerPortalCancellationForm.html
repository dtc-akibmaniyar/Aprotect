<template>
    <div class="cancellation-container">
        <!-- Loading Spinner -->
        <template if:true={isLoading}>
            <div class="spinner-container">
                <lightning-spinner alternative-text="Loading" size="large"></lightning-spinner>
            </div>
        </template>

        <!-- Error Message -->
        <template if:true={error}>
            <div class="error-message">
                <p>{error}</p>
            </div>
        </template>

        <!-- Main Content -->
        <template if:false={isLoading}>
            <template if:false={error}>
                <div class="main-layout">
            <!-- Left Side: Vehicle Info Card -->
            <div class="left-column">
                <div class="vehicle-card">

                                    <rect width="50" height="39" fill="white" />

                        </svg>

                    </div>
                    <div class="vehicle-details">
                        <div class="vehicle-name">{vehicleName}</div>
                        <div class="vehicle-info">{vehicleVIN}</div>
                        <div class="vehicle-info">Odometer: {vehicleOdometer}</div>
                        <div class="vehicle-info">Purchase Price: {vehiclePrice}</div>
                    </div>
                </div>
            </div>

            <!-- Right Side: Policy Sections -->
            <div class="right-column">
              <!-- Privacy Policy Section (Dynamic, Multiple Records) -->
<!-- Privacy Policy Section (Dynamic, Multiple Records) -->
<template if:true={privacyPolicies}>
    <template for:each={privacyPolicies} for:item="policy" for:index="index">

        <!-- Entire Policy Card -->
        <div key={policy.Id} class="policy-section">

            <!-- Dynamic Title -->
            <h2 class="policy-title">{policy.Name}</h2>

            <!-- Policy Text -->
            <lightning-formatted-rich-text
                value={policy.Policy_Text__c}
                class="policy-text"
            ></lightning-formatted-rich-text>
        </div>

        <!-- Checkbox Outside the Main Policy Section (As Requested) -->
        <div class="checkbox-container slds-m-left_medium slds-m-bottom_xx-large" key={policy.Id}>

            <input
                type="checkbox"
                id={policy.checkboxDomId}
                class="privacy-checkbox"
                data-id={policy.Id}
                onchange={handlePrivacyCheck}
                checked={policy.accepted}
            />

            <label for={policy.checkboxDomId} class="checkbox-label">
                I hereby declare that the above statements are true and request that
                A-Protect Warranty Corporation proceed with the cancellation.
            </label>

        </div>

    </template>
</template>
 <!-- Action Buttons -->
        <div class="action-buttons-container">
          <button
            class="cancel-button"
            onclick={handlecancelCancellation}
          >CANCEL</button>
          <button
            class="save-button"
            onclick={handleCancelApplication}
            disabled={disableSaveButton}
          >SAVE</button>
        </div>



            </div>
        </div>
            </template>
        </template>
    </div>
</template>
