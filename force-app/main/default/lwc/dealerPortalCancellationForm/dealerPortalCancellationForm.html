<template>
    <div class="form-view">
        <div class="page">

            <template if:true={isLoading}>
                <div class="loading-wrap">
                    <lightning-spinner size="large" alternative-text="Loading"></lightning-spinner>
                </div>
            </template>

            <template if:true={error}>
                <div class="section-title">Service Contract Cancellation</div>
                <div class="card">
                    <p class="notice-text-error">{error}</p>
                    <div class="modal-actions">
                        <button class="btn-primary" type="button" onclick={handleBackToList}>Back to Applications</button>
                    </div>
                </div>
            </template>

            <template if:false={isLoading}>
                <template if:false={error}>
                    <template if:false={linkProblem}>

                    <div class="header">
                        <h1>Service Contract Cancellation Form</h1>
                    </div>
                    <p class="notice">This form constitutes a cancellation request only. Once approved by A-Protect, the applicable refund will be issued and confirmation of the cancellation will be provided.</p>

                    <div class="grid">
                        <!-- Section 1 -->
                        <div>
                            <div class="section-title">Section 1: Contract Information</div>
                            <div class="card">
                                <label class="field-label">DATE OF REQUEST: <span class="req">*</span></label>
                                <input class="field" type="text" readonly value={dateRequestedDisplay}>

                                <label class="field-label">APPLICATION #:</label>
                                <input class="field" type="text" readonly value={ctx.applicationNumber}>

                                <label class="field-label">CUSTOMER NAME:</label>
                                <input class="field" type="text" readonly value={ctx.customerName}>

                                <label class="field-label">VEHICLE YEAR/MAKE/MODEL:</label>
                                <input class="field" type="text" readonly value={ctx.vehicle}>

                                <label class="field-label">VIN #:</label>
                                <input class="field" type="text" readonly value={ctx.vin}>
                            </div>
                        </div>

                        <!-- Section 2 -->
                        <div>
                            <div class="section-title">Section 2: Services Cancellation</div>
                            <div class="card">
                                <div class="services-section-title-row">Please select the service(s) you wish to cancel.</div>

                                <template if:true={hasPackages}>
                                    <template for:each={serviceRows} for:item="pkg">
                                        <div key={pkg.packageId} class="service-block">
                                            <div class="service-title">{pkg.category}</div>
                                            <div class="service-option">
                                                <input type="checkbox" class="svc-check" checked={pkg.selected} data-id={pkg.packageId} onchange={handlePackageToggle}>
                                                <div class="opt-text">
                                                    <b>{pkg.name}</b>{pkg.termLine}<br>Additional Options: {pkg.addonsLabel}
                                                </div>
                                            </div>
                                        </div>
                                    </template>

                                    <div class="reason-wrap">
                                        <label class="reason-label" for="reason">REASON FOR CANCELLATION: <span class="req">*</span></label>
                                        <select class="reason-select" id="reason" value={reasonCode} onchange={handleReasonChange}>
                                            <option value="">-- Select a reason --</option>
                                            <template for:each={reasonOptions} for:item="r">
                                                <option key={r.value} value={r.value}>{r.label}</option>
                                            </template>
                                        </select>
                                        <template if:true={isOtherReason}>
                                            <textarea class="field other-textarea" placeholder="Please explain the reason for cancellation" value={reasonDetail} onchange={handleDetailChange}></textarea>
                                        </template>
                                    </div>

                                    <template if:true={showConfirmBox}>
                                        <div class="confirm-box">
                                            <div class="confirm-check">✓</div>
                                            <div>{confirmText}</div>
                                        </div>
                                    </template>
                                </template>

                                <template if:false={hasPackages}>
                                    <p class="no-rows-msg">No active services found for this application.</p>
                                </template>
                            </div>
                        </div>
                    </div>

                    <div class="refund-bar">
                        <span>Refund Estimate&nbsp;&nbsp;-&nbsp;Request Amount:</span>
                        <span class="amount">{refundAmountDisplay}</span>
                    </div>

                    <br>

                    <!-- Section 3 -->
                    <div class="section-title">Section 3: Cancellation Terms &amp; Conditions</div>
                    <div class="terms-card">
                        <p><b>By signing and submitting this form, the dealership acknowledges and agrees to the following:</b></p>

                        <template for:each={termsBlocks} for:item="block">
                            <div key={block.key} class="terms-block">
                                <template if:true={block.hasHeading}>
                                    <h3>{block.heading}</h3>
                                </template>
                                <p>{block.body}</p>
                            </div>
                        </template>

                        <div class="terms-accept">
                            <input type="checkbox" class="terms-check" id="terms-accept" checked={termsAccepted} onchange={handleTermsAccept}>
                            <label for="terms-accept">I have read and accept the cancellation terms and conditions.</label>
                        </div>
                    </div>

                    <br>

                    <!-- Section 4 -->
                    <div class="section-title">Section 4: Dealership Authorization</div>
                    <div class="auth-grid">
                        <div class="auth-box">
                            <h4>Dealership Name:</h4>
                            <p>{ctx.dealerName}<br>{ctx.dealerAddress}</p>
                        </div>
                        <div class="auth-box">
                            <h4>Authorized Dealer Representative</h4>
                            <p>{ctx.repName}<br>{ctx.repTitle}</p>
                        </div>
                        <div class="auth-box">
                            <h4>Signature</h4>
                            <div class="sig-wrap">
                                <canvas class="sig-canvas" width="760" height="160"
                                    onpointerdown={handleCanvasPointerDown}
                                    onpointermove={handleCanvasPointerMove}
                                    onpointerup={handleCanvasPointerUp}
                                    onpointercancel={handleCanvasPointerUp}
                                    tabindex="0"
                                    aria-label="Signature canvas"></canvas>
                            </div>
                            <button class="sig-clear" type="button" onclick={handleClearSignature}>Clear</button>
                        </div>
                    </div>

                    <div class="submit-wrap">
                        <button class="btn-secondary" type="button" onclick={handleBackToList}>Cancel</button>
                        <button class="submit" type="button" onclick={handleSubmit} disabled={disableSave}>SUBMIT CANCELLATION REQUEST</button>
                    </div>
                    <div class="submit-hint" if:true={submitBlocked}>{missingRequirement}</div>
                    <div class="error-text">{actionError}</div>

                    </template>
                </template>
            </template>
        </div>

        <!-- Confirmation Modal -->
        <template if:true={showSuccess}>
            <div class="modal-overlay show">
                <div class="modal-box">
                    <div class="modal-icon">✓</div>
                    <h2>{successTitle}</h2>
                    <p>{successMessage}</p>
                    <div class="modal-summary">{successSummary}</div>
                    <div class="modal-actions">
                        <button class="btn-primary" type="button" onclick={handleCloseSuccess}>Close</button>
                    </div>
                </div>
            </div>
        </template>

        <!-- Read-Only Request Summary Modal -->
        <template if:true={showSummary}>
            <div class="modal-overlay show">
                <div class="modal-box view-modal-box">
                    <div class="view-summary-header">
                        <h2>Cancellation Request Summary</h2>
                        <span class="readonly-badge">READ-ONLY</span>
                    </div>
                    <p>This application already has an open cancellation request. No further changes are permitted until the request is resolved.</p>
                    <div class="modal-actions">
                        <button class="btn-secondary" type="button" onclick={handleBackToList}>Back to Applications</button>
                        <button class="btn-primary" type="button" onclick={handleViewRequest}>View Request</button>
                    </div>
                </div>
            </div>
        </template>
    </div>
</template>
