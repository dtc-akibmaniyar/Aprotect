<template>
    <lightning-card title="Create Work Order" icon-name="standard:work_order">
        <div class="slds-p-around_medium">
            <div class="slds-align_absolute-center slds-m-vertical_large">
                <h2 class="slds-text-heading_medium">Are you sure you want to create the work orders?</h2>
            </div>
            <div class="slds-align_absolute-center">
                <lightning-button
                    label="Create Work Order"
                    variant="brand"
                    onclick={handleSubmit}
                    disabled={loading}>
                </lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
