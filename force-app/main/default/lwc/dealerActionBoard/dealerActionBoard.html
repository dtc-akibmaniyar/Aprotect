<template>
    <div class="dashboard-container">
        <!-- LEFT BUTTON GRID -->
        <div class="button-grid">
            <!-- BUILD QUOTE -->
            <button class="tile" type="button" data-action="build-quote" onclick={handleClick}>
                <div class="icon">
                        <img src={staticResources.buildQuote} alt="Build Quote" class="tile-image" />
                </div>
                <p>BUILD QUOTE</p>
            </button>

            <!-- ADD NEW APPLICATION -->
            <button class="tile" type="button" data-action="add-new-application" onclick={handleClick}>
                <div class="icon">
                    <img src={staticResources.addNewApplication} alt="Add New Application" class="tile-image" />
                </div>
                <p>ADD NEW APPLICATION</p>
            </button>

            <!-- VIEW QUOTES -->
            <button class="tile" type="button" data-action="view-quotes" onclick={handleClick}>
                <div class="icon">
                    <img src={staticResources.viewQuoteAndViewApplication} alt="View Quotes" class="tile-image" />
                </div>
                <p>VIEW QUOTES</p>
            </button>

            <!-- VIEW APPLICATIONS -->
            <button class="tile" type="button" data-action="view-applications" onclick={handleClick}>
                <div class="icon">
                    <img src={staticResources.viewQuoteAndViewApplication} alt="View Applications" class="tile-image" />
                </div>
                <p>VIEW APPLICATIONS</p>
            </button>

            <!-- MAKE A PAYMENT -->
            <button class="tile tile-payment" type="button" data-action="make-a-payment" onclick={handleClick}>
                <template if:true={unpaidAppCount}>
                    <span class="payment-badge">{unpaidAppCount}</span>
                </template>
                <div class="icon">
                    <img src={staticResources.makePayment} alt="Make A Payment" class="tile-image" />
                </div>
                <p>MAKE A PAYMENT</p>
                <template if:true={unpaidAppCount}>
                    <span class="payment-subtitle">{unpaidAppCountLabel}</span>
                </template>
            </button>

            <!-- DEALER SUPPORT -->
            <button class="tile" type="button" data-action="dealer-support" onclick={handleClick}>
                <div class="icon">
                    <img src={staticResources.dealerSuppost} alt="Dealer Support" class="tile-image" />
                </div>
                <p>DEALER SUPPORT</p>
            </button>
        </div>

        <!-- RIGHT MESSAGE BOARD -->
        <div class="message-board">
            <div class="board-header">
                <h2>MESSAGE BOARD</h2>
            </div>
            <div class="board-tabs">
                <button class={aProtectTabClass} data-tab="aprotect" onclick={handleTabClick}>A-Protect Notices</button>
                <button class={dealerTabClass} data-tab="dealer" onclick={handleTabClick}>Dealer Notices</button>
            </div>
            <div class="board-body">
                <template if:true={isAProtectTab}>
                    <template if:true={hasCompanyNotices}>
                        <template for:each={formattedCompanyNotices} for:item="notice">
                            <div key={notice.Id} class="notice-item">
                                <span class="notice-date">{notice.formattedDate}</span>
                                <lightning-formatted-rich-text value={notice.Notice_Message__c}></lightning-formatted-rich-text>
                            </div>
                        </template>
                    </template>
                    <template if:false={hasCompanyNotices}>
                        <p class="empty-msg">No notices available.</p>
                    </template>
                </template>
                <template if:true={isDealerTab}>
                    <template if:true={hasDealerNotices}>
                        <template for:each={formattedDealerNotices} for:item="notice">
                            <div key={notice.Id} class="notice-item">
                                <span class="notice-date">{notice.formattedDate}</span>
                                <lightning-formatted-rich-text value={notice.Notice_Message__c}></lightning-formatted-rich-text>
                            </div>
                        </template>
                    </template>
                    <template if:false={hasDealerNotices}>
                        <p class="empty-msg">No dealer notices available.</p>
                    </template>
                </template>
            </div>
        </div>
    </div>

    <!-- Make Payment Modal -->
    <template if:true={showMakePaymentModal}>
        <c-dealer-make-payment-modal
            unpaid-applications={unpaidApplications}
            is-loading={isLoadingApplications}
            onclose={handleCloseMakePaymentModal}
            oncreateremittance={handleCreateRemittanceFromModal}>
        </c-dealer-make-payment-modal>
    </template>

    <!-- New Quote Modal -->
    <template if:true={showNewQuoteModal}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-new-quote" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container Create-New-modal">
                <button class="modal-close-btn" onclick={handleCloseNewQuoteModal} aria-label="Close">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M18 6L6 18M6 6L18 18" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
                <div class="slds-p-left_medium slds-p-right_medium slds-p-top_medium">
                    <h2 id="modal-heading-new-quote" class="modal-title">Create New Quote</h2>
                </div>
                <div class="slds-p-left_medium slds-p-right_medium">
                    <p class="cancellation-message">
                        Would you like to create a new quote?
                    </p>
                </div>
                <div class="slds-p-left_medium slds-p-right_medium slds-p-top_medium">
                    <button class="modal-btn-continue slds-p-around_x-small" onclick={handleContinueToCreateQuote}>Continue to Create New Quote</button>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" onclick={handleCloseNewQuoteModal}></div>
    </template>

    <!-- New Application Modal -->
    <template if:true={showNewApplicationModal}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-new-application" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container Create-New-modal">
                <button class="modal-close-btn" onclick={handleCloseNewApplicationModal} aria-label="Close">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M18 6L6 18M6 6L18 18" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
                <div class="slds-p-left_medium slds-p-right_medium slds-p-top_medium">
                    <h2 id="modal-heading-new-application" class="modal-title">Create New Application</h2>
                </div>
                <div class="slds-p-left_medium slds-p-right_medium">
                    <p class="cancellation-message">
                        Would you like to create a new application?
                    </p>
                </div>
                <div class="slds-p-left_medium slds-p-right_medium slds-p-top_medium">
                    <button class="modal-btn-continue slds-p-around_x-small" onclick={handleContinueToCreateApplication}>Continue to Create New Application</button>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" onclick={handleCloseNewApplicationModal}></div>
    </template>
</template>
