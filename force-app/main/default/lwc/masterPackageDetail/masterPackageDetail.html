<template><button class="ap-back" type="button" onclick={handleBack}>&#8249; {backLabel}</button><template lwc:if={notice}><div class={noticeClass} role="status"><span>{notice}</span><button class="ap-toast-x" type="button" onclick={handleDismissNotice}>&#10005;</button></div></template><template lwc:if={errorMessage}><div class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_small" role="alert"><span>{errorMessage}</span></div></template><p class="ap-eyebrow">Package</p><h1>{title}</h1><template lwc:if={hasDetail}><span class={statusClass}>{detail.statusLabel}</span></template><div class="ap-section-head"><div><p class="ap-eyebrow">Step 4 of 4</p><h2 class="ap-title">Package Details</h2></div><template lwc:if={hasDetail}><div class="ap-actions"><template lwc:if={isInactive}><button class="ap-btn" type="button" onclick={handleToggleActive}>Activate</button></template><template lwc:else><button class="ap-btn ap-btn_danger" type="button" onclick={handleDeactivateCascade}>Deactivate Package</button></template><button class="ap-btn ap-btn_primary" type="button" onclick={handleEditPackage}>Edit Package</button></div></template></div><template lwc:if={hasDetail}><div class="ap-summary"><div class="ap-summary-cell"><p class="ap-field-eyebrow">Catalogue</p><div class="ap-field-value">{detail.releaseName}</div></div><div class="ap-summary-cell"><p class="ap-field-eyebrow">Package Group</p><div class="ap-field-value">{detail.groupName}</div></div><div class="ap-summary-cell"><p class="ap-field-eyebrow">Record Type</p><div class="ap-field-value">{detail.recordTypeLabel}</div></div><div class="ap-summary-cell"><p class="ap-field-eyebrow">Type</p><div class="ap-field-value">{detail.packageTypeLabel}</div></div><div class="ap-summary-cell"><p class="ap-field-eyebrow">Class</p><div class="ap-field-value">{detail.classLabel}</div></div><div class="ap-summary-cell"><p class="ap-field-eyebrow">Category</p><div class="ap-field-value">{detail.categoryLabel}</div></div></div><div class="ap-field-stack"><div class="ap-field-row"><div class="ap-field-block"><p class="ap-field-eyebrow">Per Claim Limit</p><div class="ap-field-value">{detail.perClaimLimitLabel}</div></div><div class="ap-field-block"><p class="ap-field-eyebrow">Deductible</p><div class="ap-field-value">{detail.deductibleLabel}</div></div></div></div><p class="ap-eyebrow">Eligibility</p><div class="ap-field-stack"><div class="ap-field-row"><div class="ap-field-block"><p class="ap-field-eyebrow">Year Restriction</p><div class="ap-field-value ap-field-value_wrap">{detail.eligibilityYearLabel}</div></div><div class="ap-field-block"><p class="ap-field-eyebrow">Odometer / Distance Cap</p><div class="ap-field-value ap-field-value_wrap">{detail.odometerCapLabel}</div></div></div><div class="ap-field-block"><p class="ap-field-eyebrow">Included / Excluded Use Notes</p><div class="ap-field-value ap-field-value_wrap">{detail.descriptionLabel}</div></div></div><div class="ap-section-head"><div><p class="ap-eyebrow">Included Options</p><p class="ap-sub">Parts and benefits covered as standard on this package.</p></div><button class="ap-btn ap-btn_sm" type="button" onclick={handleNewOption}>+ Add Included Option</button></div><template lwc:if={hasIncludedOptions}><table class="slds-table slds-table_cell-buffer slds-table_bordered"><thead><tr><th scope="col">Option</th><th scope="col">Category</th><th scope="col" class="ap-price-col">Price</th><th scope="col" class="ap-text-col">Inclusions</th><th scope="col" class="ap-text-col">Exclusions</th><th scope="col" class="ap-act-col">Actions</th></tr></thead><tbody><template for:each={includedOptions} for:item="option"><tr key={option.id}><td>{option.label}</td><td>{option.categoryLabel}</td><td class="ap-price-col">{option.priceLabel}</td><td class="ap-text-col">{option.inclusionLabel}</td><td class="ap-text-col">{option.exclusionLabel}</td><td class="ap-act-col"><button class="ap-btn ap-btn_xs" type="button" data-id={option.id} onclick={handleEditOption}>Edit</button><button class="ap-btn ap-btn_xs ap-btn_danger" type="button" data-id={option.id} onclick={handleDeleteOption}>Delete</button></td></tr></template></tbody></table></template><template lwc:else><p class="ap-sub ap-empty">No included options are set on this package.</p></template><div class="ap-section-head"><div><p class="ap-eyebrow">Additional Options</p><p class="ap-sub">Optional cover an applicant may add at the quoted price.</p></div><button class="ap-btn ap-btn_sm" type="button" onclick={handleNewOptionalOption}>+ Add Optional Option</button></div><template lwc:if={hasOptionalOptions}><table class="slds-table slds-table_cell-buffer slds-table_bordered"><thead><tr><th scope="col">Option</th><th scope="col">Category</th><th scope="col" class="ap-price-col">Price</th><th scope="col" class="ap-text-col">Inclusions</th><th scope="col" class="ap-text-col">Exclusions</th><th scope="col" class="ap-act-col">Actions</th></tr></thead><tbody><template for:each={optionalOptions} for:item="option"><tr key={option.id}><td>{option.label}</td><td>{option.categoryLabel}</td><td class="ap-price-col">{option.priceLabel}</td><td class="ap-text-col">{option.inclusionLabel}</td><td class="ap-text-col">{option.exclusionLabel}</td><td class="ap-act-col"><button class="ap-btn ap-btn_xs" type="button" data-id={option.id} onclick={handleEditOption}>Edit</button><button class="ap-btn ap-btn_xs ap-btn_danger" type="button" data-id={option.id} onclick={handleDeleteOption}>Delete</button></td></tr></template></tbody></table></template><template lwc:else><p class="ap-sub ap-empty">No additional (optional) options are set on this package.</p></template><div class="ap-section-head"><div><p class="ap-eyebrow">Capped Benefits</p><p class="ap-sub">{capSummary}</p></div></div><template lwc:if={hasBenefitCaps}><table class="slds-table slds-table_cell-buffer slds-table_bordered"><thead><tr><th scope="col">Benefit</th><th scope="col" class="ap-price-col">Cap</th><th scope="col" class="ap-act-col">Actions</th></tr></thead><tbody><template for:each={detail.benefitCaps} for:item="benefit"><tr key={benefit.id}><td>{benefit.label}</td><td class="ap-price-col">{benefit.capLabel}</td><td class="ap-act-col"><button class="ap-btn ap-btn_xs" type="button" data-id={benefit.id} onclick={handleEditBenefitCap}>Edit</button><button class="ap-btn ap-btn_xs ap-btn_danger" type="button" data-id={benefit.id} onclick={handleDeleteBenefitCap}>Delete</button></td></tr></template></tbody></table></template><template lwc:else><p class="ap-sub ap-empty">No capped benefits are set on this package.</p></template><div class="ap-section-head"><div><p class="ap-eyebrow">Add-Ons</p><p class="ap-sub">Flat-fee riders on a term (e.g. claims-free renewal). {addOnSummary}</p></div></div><template lwc:if={hasAddOns}><table class="slds-table slds-table_cell-buffer slds-table_bordered"><thead><tr><th scope="col">Add-On</th><th scope="col" class="ap-price-col">Price</th><th scope="col" class="ap-act-col">Actions</th></tr></thead><tbody><template for:each={detail.addOns} for:item="addon"><tr key={addon.id}><td>{addon.label}</td><td class="ap-price-col">{addon.priceLabel}</td><td class="ap-act-col"><button class="ap-btn ap-btn_xs" type="button" data-id={addon.id} onclick={handleEditAddOn}>Edit</button><button class="ap-btn ap-btn_xs ap-btn_danger" type="button" data-id={addon.id} onclick={handleDeleteAddOn}>Delete</button></td></tr></template></tbody></table></template><template lwc:else><p class="ap-sub ap-empty">No add-ons are set on this package's terms.</p></template><div class="ap-section-head"><div><p class="ap-eyebrow">Tiers &amp; Term Pricing</p><p class="ap-sub">A tier is an odometer band; the price is carried on the term.</p></div><button class="ap-btn ap-btn_sm" type="button" onclick={handleNewTier}>+ Add Band</button></div><template lwc:if={hasTierBlocks}><template for:each={detail.tierBlocks} for:item="block"><div class="ap-block" key={block.groupKey}><div class="ap-block-head"><span class="ap-band">{block.bandLabel}</span><span class="ap-tier-name">{block.tierName}</span><template lwc:if={block.hasTier}><button class="ap-btn ap-btn_xs" type="button" data-id={block.tierId} onclick={handleEditTier}>Edit band</button><button class="ap-btn ap-btn_xs ap-btn_danger" type="button" data-id={block.tierId} onclick={handleDeleteTier}>Delete band</button></template></div><table class="slds-table slds-table_cell-buffer slds-table_bordered"><thead><tr><th scope="col">Term</th><th scope="col" class="ap-price-col">Price</th><th scope="col" class="ap-act-col">Actions</th></tr></thead><tbody><template for:each={block.terms} for:item="term"><tr key={term.id}><td>{term.name}</td><td class="ap-price-col">{term.priceLabel}</td><td class="ap-act-col"><button class="ap-btn ap-btn_xs" type="button" data-id={term.id} onclick={handleEditTerm}>Edit</button><button class="ap-btn ap-btn_xs" type="button" data-term={term.id} onclick={handleNewAddOn}>+Add-on</button><button class="ap-btn ap-btn_xs" type="button" data-term={term.id} onclick={handleNewBenefitCap}>+Cap</button><button class="ap-btn ap-btn_xs ap-btn_danger" type="button" data-id={term.id} onclick={handleDeleteTerm}>Delete</button></td></tr></template></tbody></table></div></template></template><template lwc:else><p class="ap-sub ap-empty">This package has no terms.</p></template><button class="ap-btn ap-btn_sm" type="button" onclick={handleNewTerm}>+ Add Term</button><div class="ap-section-head"><div><p class="ap-eyebrow">Vehicle Schedules</p><p class="ap-sub">Schedules bound to this package (master-side assignments only).</p></div><button class="ap-btn" type="button" onclick={handleOpenSchedules}>Manage Vehicle Schedules</button></div><template lwc:if={hasSchedules}><table class="slds-table slds-table_cell-buffer slds-table_bordered"><thead><tr><th scope="col">Schedule</th><th scope="col">Type</th><th scope="col">Effective Window</th></tr></thead><tbody><template for:each={schedules} for:item="schedule"><tr key={schedule.id}><td>{schedule.scheduleName}</td><td>{schedule.scheduleTypeLabel}</td><td>{schedule.windowLabel}</td></tr></template></tbody></table></template><template lwc:else><p class="ap-sub ap-empty">No vehicle schedules are assigned to this package.</p></template><div class="ap-notice"><span>Pricing is driven by the term. A tier is an odometer band; the price shown is the master catalogue price carried on the term. Editing a master package updates the master book — synced dealer copies are refreshed separately by the package sync service.</span></div></template><template lwc:if={loading}><p class="ap-sub">Loading package details…</p></template><c-master-package-editor onwritten={handleWritten} onwriteerror={handleWriteError}></c-master-package-editor><c-master-package-schedule onwritten={handleWritten} onwriteerror={handleWriteError}></c-master-package-schedule></template>
