<template><div class="ap-topbar"><div class="ap-brand-mark">AP</div><div><div class="ap-brand-name">A-Protect Admin</div><div class="ap-brand-sub">Extended Warranties</div></div></div><div class="ap-page"><template lwc:if={hasNotice}><div class={noticeClass} role="status"><span>{notice}</span><button class="ap-toast-x" type="button" onclick={handleDismissNotice}>&#10005;</button></div></template><template lwc:if={errorMessage}><div class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_small" role="alert"><span>{errorMessage}</span></div></template><template lwc:if={isCatalogueList}><div class="ap-page-head"><h1>Master Package Catalogues</h1><div class="ap-legend"><div class="ap-legend-row"><span class="ap-dot ap-dot_published"></span>Published — In Circulation</div><div class="ap-legend-row"><span class="ap-dot ap-dot_draft"></span>Draft — Not Live</div><div class="ap-legend-row"><span class="ap-dot ap-dot_archived"></span>Superseded — No Longer Offered</div></div></div><div class="ap-section-head"><div><p class="ap-eyebrow">Vehicle Schedules</p><p class="ap-sub">A package-independent axis: browse and edit every master vehicle schedule.</p></div><button class="ap-btn" type="button" onclick={handleOpenSchedulesBrowse}>Browse Vehicle Schedules</button></div><p class="ap-eyebrow">Step 1 of 4</p><h2 class="ap-title">Select a Catalogue</h2><p class="ap-sub">Choose a catalogue to view its package groups.</p><template lwc:if={hasReleases}><div class="ap-nav-list"><template for:each={releases} for:item="release"><button key={release.id} class="ap-nav-row" type="button" data-id={release.id} onclick={handleSelectRelease}><div class="ap-nav-main"><p class="ap-nav-eyebrow">Master Package Catalogue</p><div class="ap-nav-name">{release.name}</div><div class="ap-nav-meta">{release.subtitle}</div></div><span class="ap-badge">{release.groupCountLabel}</span><span class={release.statusClass}>{release.statusLabel}</span></button></template></div></template><template lwc:else><p class="ap-sub">No catalogue releases were found.</p></template></template><template lwc:if={isCatalogue}><button class="ap-back" type="button" onclick={handleBackToList}>&#8249; Master Package Catalogues</button><div class="ap-banner"><div class="ap-field-block"><p class="ap-field-eyebrow">Master Package Catalogue Name</p><div class="ap-nav-name">{catalogueName}</div></div><div class="ap-field-block" style="flex: 2 1 14rem;"><p class="ap-field-eyebrow">Description</p><div class="ap-nav-meta">{catalogueDescription}</div></div><span class={catalogueStatusClass}>{catalogueStatusLabel}</span></div><p class="ap-eyebrow">Step 2 of 4</p><h2 class="ap-title">Package Groups</h2><p class="ap-sub">Select a group to view its packages.</p><template lwc:if={hasGroups}><div class="ap-nav-list"><template for:each={groups} for:item="group"><button key={group.id} class="ap-nav-row" type="button" data-id={group.id} onclick={handleSelectGroup}><div class="ap-nav-main"><p class="ap-nav-eyebrow">Package Group</p><div class="ap-nav-name">{group.name}</div><div class="ap-nav-meta">{group.activeLabel}</div></div><span class="ap-badge">{group.packageCountLabel}</span></button></template></div></template><template lwc:else><p class="ap-sub">This catalogue has no package groups.</p></template></template><template lwc:if={isGroup}><button class="ap-back" type="button" onclick={handleBackToCatalogue}>&#8249; {catalogueName}</button><p class="ap-eyebrow">Package Group</p><h1>{groupName}</h1><div class="ap-section-head"><div><p class="ap-eyebrow">Step 3 of 4</p><h2 class="ap-title">Packages</h2><p class="ap-sub">Select a package to view or edit its details and rate schedule.</p></div><div class="ap-actions"><button class="ap-btn" type="button" onclick={handleOpenSchedulesGroup}>Vehicle Schedules</button><button class="ap-btn ap-btn_primary" type="button" onclick={handleNewPackage}>+ New Package</button></div></div><template lwc:if={hasPackages}><div class="ap-nav-list"><template for:each={packages} for:item="pkg"><button key={pkg.id} class="ap-nav-row" type="button" data-id={pkg.id} onclick={handleSelectPackage}><div class="ap-nav-main"><p class="ap-nav-eyebrow">Package</p><div class="ap-nav-name">{pkg.name}</div><div class="ap-nav-meta">{pkg.perClaimLimitLabel} · {pkg.deductibleLabel} · {pkg.eligibilityLabel}</div></div><span class={pkg.statusClass}>{pkg.statusLabel}</span></button></template></div></template><template lwc:else><p class="ap-sub">This group has no packages yet. Use “New Package” to add one.</p></template></template><template lwc:if={isPackage}><c-master-package-detail package-id={selectedPackageId} package-name={selectedPackageName} auto-edit={autoEditNew} back-label={backToGroupLabel} onwritten={handleWritten} onwriteerror={handleWriteError} onback={handleBackToGroup}></c-master-package-detail></template></div><c-master-package-schedule onwritten={handleWritten} onwriteerror={handleWriteError}></c-master-package-schedule><footer class="ap-footer"> Master catalogue data only. This component reads and edits the master package book and never displays dealer packages or dealer pricing. </footer></template>
